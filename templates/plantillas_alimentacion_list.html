<div class="panel panel-default">
    <h4 class="panel-title">Plantillas alimentación</h4>
    <div id="nutrition-templates" class="flex flex-col gap-2">
        {% for pt in plantillas %}
        <div class="pt-card card" draggable="true" data-pt-id="{{ pt.id }}">
            <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-neutral-200 truncate">{{ pt.nombre }}</span>
                <span class="text-xs text-neutral-400">{{ pt.alimentos|length }} alimentos</span>
            </div>
            <div class="flex items-center gap-1">
                <button
                    type="button"
                    data-action="apply-meal-template"
                    data-pt-id="{{ pt.id }}"
                    class="btn btn-outline"
                >Aplicar</button>
                
                <button
                    type="button"
                    data-action="delete-meal-template"
                    data-pt-id="{{ pt.id }}"
                    class="btn btn-outline btn-outline-danger"
                >Eliminar</button>
            </div>
        </div>
        {% else %}
        <p class="text-xs text-neutral-400">Guarda un día desde el panel de alimentación.</p>
        {% endfor %}
    </div>
</div>
