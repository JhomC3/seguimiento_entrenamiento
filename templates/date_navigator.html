<div id="date-navigator" class="bg-neutral-900 border border-transparent rounded-xl p-4 flex flex-col gap-3 neon-border metallic-border">
    <div class="flex items-center gap-2">
        <button type="button" data-action="scroll-dates" data-dir="-1" class="nav-arrow" title="Fechas anteriores">←</button>

        <div id="date-strip" class="flex items-center gap-0.5 overflow-x-auto flex-1 min-w-0 no-scrollbar">
            {% for d in dates %}
            <button
                type="button"
                data-action="select-date"
                data-iso="{{ d.iso }}"
                class="date-num {% if d.selected %}selected{% endif %}"
                title="{{ d.iso }}"
            >
                {{ d.label }}
                {% if d.has_data %}<span class="date-dot"></span>{% endif %}
            </button>
            {% endfor %}
        </div>

        <label class="relative h-7 w-7 flex-none grid place-items-center text-neutral-400 hover:text-burgundy-400 transition-colors cursor-pointer" title="Ir a fecha">
            <svg class="pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <input type="date" id="date-jump" data-action="jump-date-input" value="{{ selected_iso }}"
                aria-label="Ir a fecha"
                class="absolute inset-0 opacity-0 cursor-pointer">
        </label>

        <button type="button" data-action="jump-date" data-iso="{{ today_iso }}" class="today-btn" title="Ir a hoy">HOY</button>

        <button type="button" data-action="scroll-dates" data-dir="1" class="nav-arrow" title="Próximas fechas">→</button>
    </div>
</div>
