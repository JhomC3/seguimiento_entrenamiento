<div id="date-navigator" class="bg-neutral-900 border border-transparent rounded-xl p-4 flex flex-col gap-3 neon-border metallic-border animate-fade-in">
    <div class="flex items-center gap-2">
        <button
            hx-get="/fecha?fecha={{ selected_iso }}&shift={{ shift_prev }}"
            hx-swap="none"
            class="nav-arrow"
            title="Fechas anteriores"
        >←</button>

        <div class="flex items-center gap-0.5 overflow-x-auto flex-1 min-w-0 no-scrollbar">
            {% for d in dates %}
            <button
                hx-get="/fecha?fecha={{ d.iso }}&shift=0"
                hx-swap="none"
                class="date-num {% if d.selected %}selected{% endif %}"
                title="{{ d.iso }}"
            >
                {{ d.label }}
                {% if d.has_data %}<span class="date-dot"></span>{% endif %}
            </button>
            {% endfor %}
        </div>

        <input
            type="date"
            name="fecha"
            value="{{ selected_iso }}"
            hx-get="/fecha"
            hx-trigger="change"
            hx-include="this"
            hx-swap="none"
            class="date-input"
            title="Ir a una fecha"
        >

        <button
            hx-get="/fecha?fecha={{ selected_iso }}&shift={{ shift_next }}"
            hx-swap="none"
            class="nav-arrow"
            title="Próximas fechas"
        >→</button>
    </div>
</div>
