<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- SortableJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            200: '#f7ccd5',
                            300: '#f0a3b3',
                            400: '#e56d88',
                            500: '#d23d5f',
                            600: '#9b1b30', // Carmesí metálico
                            700: '#800020', // Deep Vinotinto
                            800: '#66001a',
                            900: '#4d0013',
                            950: '#2d020c',
                        },
                        matte: {
                            900: '#121212',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    {% include "partials/notices.html" %}

    {% include "partials/confirm_modal.html" %}

    {% block content %}{% endblock %}

    {% include "partials/app_config.html" %}
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
