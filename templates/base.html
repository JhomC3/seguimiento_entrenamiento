<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            200: '#f7ccd5',
                            300: '#f0a3b3',
                            400: '#e56d88',
                            500: '#d23d5f',
                            600: '#9b1b30', // Carmesí metálico
                            700: '#800020', // Deep Vinotinto
                            800: '#66001a',
                            900: '#4d0013',
                            950: '#2d020c',
                        },
                        matte: {
                            900: '#121212',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
        
        /* Remove default browser focus/active outlines */
        button {
            -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible, button:active {
            outline: none !important;
        }
        
        /* Neon glow effects */
        .neon-border {
            box-shadow: 
                0 0 20px rgba(255, 30, 70, 0.10),
                0 0 40px rgba(255, 30, 70, 0.06),
                0 0 80px rgba(255, 30, 70, 0.03);
        }
        .metallic-border {
            position: relative;
            background-clip: padding-box !important;
        }
        .metallic-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: inherit;
            background: linear-gradient(
                145deg,
                rgba(220, 220, 235, 0.3) 0%,
                rgba(155, 27, 48, 0.4) 35%,
                rgba(220, 220, 235, 0.1) 65%,
                rgba(80, 80, 100, 0.2) 100%
            );
            z-index: -1;
            pointer-events: none;
        }
        .neon-title {
            text-shadow: 
                0 0 4px rgba(255, 30, 70, 0.9),
                0 0 12px rgba(255, 30, 70, 0.5),
                0 0 25px rgba(255, 30, 70, 0.25);
        }
    </style>
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    {% block content %}{% endblock %}
</body>
</html>
