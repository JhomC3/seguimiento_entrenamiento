<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker — Progreso de entrenamiento</title>
    <meta name="description" content="Seguimiento de entrenamiento, alimentación y salud: series, RIR, volumen, nutrición diaria y sincronización con Health Connect.">
    <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
    <!-- Tailwind compilado estáticamente (sin CDN runtime) -->
    <link rel="stylesheet" href="{{ static_url('css/tailwind.css') }}">

    <!-- Plotly se carga bajo demanda (ver static/js/chart-interaction.js) -->
    <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    {% include "partials/notices.html" %}

    <script type="module" src="{{ static_url('js/app.js') }}"></script>

</html>
