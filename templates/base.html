<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            200: '#f7ccd5',
                            300: '#f0a3b3',
                            400: '#e56d88',
                            500: '#d23d5f',
                            600: '#9b1b30', // Carmesí metálico
                            700: '#800020', // Deep Vinotinto
                            800: '#66001a',
                            900: '#4d0013',
                            950: '#2d020c',
                        },
                        matte: {
                            900: '#121212',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            background-color: #0a0a0a;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
        
        /* Remove default browser focus/active outlines */
        button {
            -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible, button:active {
            outline: none !important;
        }
        
        /* Neon glow effects */
        .neon-border {
            box-shadow: 
                0 0 20px rgba(255, 30, 70, 0.10),
                0 0 40px rgba(255, 30, 70, 0.06),
                0 0 80px rgba(255, 30, 70, 0.03);
        }
        .metallic-border {
            position: relative;
            background-clip: padding-box !important;
        }
        .metallic-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: inherit;
            background: linear-gradient(
                145deg,
                rgba(220, 220, 235, 0.3) 0%,
                rgba(155, 27, 48, 0.4) 35%,
                rgba(220, 220, 235, 0.1) 65%,
                rgba(80, 80, 100, 0.2) 100%
            );
            z-index: -1;
            pointer-events: none;
        }
        .neon-title {
            text-shadow: 
                0 0 4px rgba(255, 30, 70, 0.9),
                0 0 12px rgba(255, 30, 70, 0.5),
                0 0 25px rgba(255, 30, 70, 0.25);
        }

        /* Navegador de fechas */
        .date-num {
            position: relative;
            flex: none;
            min-width: 26px;
            padding: 6px 4px 9px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: #a3a3a3;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            transition: color .15s;
            cursor: pointer;
        }
        .date-num:hover {
            color: #fff;
        }
        .date-num.selected {
            color: #e56d88;
            background: rgba(155, 27, 48, 0.25);
        }
        .date-dot {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            border-radius: 9999px;
            background: #e56d88;
        }
        .nav-arrow {
            flex: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid #262626;
            background: #0a0a0a;
            color: #a3a3a3;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all .15s;
        }
        .nav-arrow:hover {
            border-color: #9b1b30;
            color: #e56d88;
        }
        .date-input {
            flex: none;
            width: 118px;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 11px;
            color: #e5e5e5;
        }
        .date-input:focus {
            border-color: #9b1b30;
            outline: none;
        }
        .today-btn {
            flex: none;
            height: 30px;
            padding: 0 12px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(163, 163, 163, 0.45);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: color .15s;
        }
        .today-btn:hover {
            color: #e56d88;
        }
        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Botones +/− de filas (overlay glass, visibles al hover) */
        .row-btn {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            transition: all .15s;
        }
        .row-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Spinners numéricos: se mantienen nativos, solo baja un poco su color al aparecer */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        /* Avisos: flotantes fijos arriba-centro, superpuestos, sin afectar layout */
        #notice-container {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }
        .notice {
            width: fit-content;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 11px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity .4s ease;
        }
        .notice-success {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: rgba(110, 231, 183, 0.9);
        }
        .notice-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: rgba(252, 165, 165, 0.95);
        }
        .notice.hide {
            opacity: 0;
        }

        /* Lápiz de edición: encendido = editable, apagado = solo lectura */
        .edit-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: color .15s, background .15s, box-shadow .15s;
            cursor: pointer;
        }
        .edit-toggle.on {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
        .edit-toggle.off {
            color: rgba(255, 255, 255, 0.35);
        }
        .edit-toggle.off:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Modal de confirmación de cambios sin guardar */
        #confirm-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 60;
        }
        #confirm-modal .confirm-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 20px;
            width: min(380px, calc(100vw - 40px));
            box-shadow: 0 0 24px rgba(155, 27, 48, 0.25);
        }
        #confirm-modal.hidden {
            display: none;
        }

        /* Hover de fila: solo cuando el modo editable está activo, en cualquier fecha */
        #session-editor[data-editmode="1"] .set-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }
    </style>
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    <div id="notice-container"></div>

    <div id="confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Cambios sin guardar">
        <div class="confirm-card flex flex-col gap-4">
            <p id="confirm-msg" class="text-sm text-neutral-200">¿Guardar los cambios?</p>
            <div class="flex justify-end gap-2">
                <button type="button" id="confirm-cancel" class="h-8 px-4 bg-black hover:bg-neutral-900 text-neutral-300 border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black">Cancelar</button>
                <button type="button" id="confirm-save" class="h-8 px-5 bg-burgundy-700 hover:bg-burgundy-600 text-white text-xs rounded-lg transition-colors uppercase tracking-widest font-black">Guardar</button>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    <script>
        let pendingNav = null;
        let confirmCbs = null;
        let saveRequested = false;

        function scheduleNotices() {
            document.querySelectorAll('.notice:not(.scheduled)').forEach(function (el) {
                el.classList.add('scheduled');
                const delay = parseInt(el.dataset.dismiss || '3000', 10);
                setTimeout(function () {
                    el.classList.add('hide');
                    setTimeout(function () { el.remove(); }, 450);
                }, delay);
            });
        }

        /* ---------- Modal de confirmación ---------- */
        function showConfirmDialog(onSave, onDiscard) {
            confirmCbs = { onSave, onDiscard };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function hideConfirmDialog() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCbs = null;
        }

        /* ---------- Estado del editor ---------- */
        function editorEditmode() {
            return document.getElementById('session-editor')?.dataset.editmode;
        }

        function serializeForm() {
            const form = document.getElementById('session-form');
            if (!form) return '[]';
            const rows = Array.from(form.querySelectorAll('#set-rows .set-row')).map(row => {
                const sel = row.querySelector('.ej-select');
                const inputs = Array.from(row.querySelectorAll('input')).map(i => i.value);
                return [sel ? sel.value : '', ...inputs];
            });
            return JSON.stringify(rows);
        }

        function captureBaseline() {
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.baseline = serializeForm();
        }

        function isDirty() {
            const editor = document.getElementById('session-editor');
            if (!editor || editor.dataset.baseline === undefined) return false;
            return editor.dataset.baseline !== serializeForm();
        }

        function updateEditActions() {
            const actions = document.getElementById('edit-actions');
            if (!actions) return;
            const show = editorEditmode() === '1' && isDirty();
            actions.classList.toggle('invisible', !show);
        }

        function syncEditorFromContent() {
            const editor = document.getElementById('session-editor');
            const st = document.getElementById('editor-state');
            if (!editor || !st) return;
            editor.dataset.editmode = st.dataset.readonly === '1' ? '0' : '1';
            captureBaseline();
            updateEditActions();
        }

        function setPanelReadonly() {
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = true; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.add('hidden'); el.hidden = true; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '0';
            const pencil = document.querySelector('#session-editor .edit-toggle');
            if (pencil) {
                pencil.classList.remove('on');
                pencil.classList.add('off');
            }
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            captureBaseline();
        }

        function handleEditorState() {
            const st = document.getElementById('editor-state');
            if (st && st.dataset.readonly === '1') setPanelReadonly();
        }

        function enterEditMode() {
            if (editorEditmode() === '1') return;
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = false; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.remove('hidden'); el.hidden = false; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '1';
            const st = document.getElementById('editor-state');
            if (st) st.dataset.readonly = '0';
            const pencil = document.querySelector('#session-editor .edit-toggle');
            if (pencil) {
                pencil.classList.remove('off');
                pencil.classList.add('on');
            }
            captureBaseline();
            updateEditActions();
        }

        function exitEditMode() {
            const editor = document.getElementById('session-editor');
            const fecha = editor?.querySelector('#session-form input[name="fecha"]')?.value;
            if (isDirty()) {
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(fecha || '', true); }
                );
            } else {
                doNav(fecha || '', true);
            }
        }

        function toggleEdit() {
            if (editorEditmode() === '1') {
                exitEditMode();
            } else {
                enterEditMode();
            }
        }

        /* ---------- Filas ---------- */
        function addRowAfter(btn) {
            if (editorEditmode() !== '1') return;
            const row = btn.closest('.set-row');
            const clone = row.cloneNode(true);
            clone.querySelector('.ej-select').value = '';
            clone.querySelectorAll('input').forEach(input => { input.value = ''; });
            row.after(clone);
            renumberRows();
            updateEditActions();
        }

        function removeRow(btn) {
            if (editorEditmode() !== '1') return;
            btn.closest('.set-row').remove();
            renumberRows();
            updateEditActions();
        }

        function renumberRows() {
            document.querySelectorAll('#set-rows .set-row').forEach((row, i) => {
                row.querySelector('.set-num').textContent = i + 1;
            });
        }

        /* ---------- Guardar ---------- */
        function submitSave() {
            const form = document.getElementById('session-form');
            if (form) form.requestSubmit();
        }

        /* ---------- Navegación entre fechas ---------- */
        function doNav(iso, force) {
            if (!iso) return;
            if (force) {
                pendingNav = null;
            } else if (pendingNav) {
                return;
            }
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            if (typeof currentIso !== 'undefined') currentIso = iso;
            document.querySelectorAll('.date-num.selected').forEach(b => b.classList.remove('selected'));
            const btn = document.querySelector(`.date-num[data-iso="${iso}"]`);
            if (btn) btn.classList.add('selected');
            htmx.ajax('GET', `/fecha/editor?fecha=${iso}`, { target: '#session-editor-wrap', swap: 'innerHTML' });
            if (btn) btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }

        function requestNavigate(iso) {
            if (isDirty()) {
                pendingNav = iso;
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(iso, true); }
                );
            } else {
                doNav(iso);
            }
        }

        /* ---------- Sincronización post-guardado ---------- */
        function updateDateDot(fecha, has) {
            const btn = document.querySelector(`.date-num[data-iso="${fecha}"]`);
            if (!btn) return;
            const dot = btn.querySelector('.date-dot');
            if (has) {
                if (!dot) btn.insertAdjacentHTML('beforeend', '<span class="date-dot"></span>');
            } else if (dot) {
                dot.remove();
            }
        }

        function recalcRM() {
            document.querySelectorAll('#set-rows .set-row').forEach(function (row) {
                const kgEl = row.querySelector('input[name="kg"]');
                const repsEl = row.querySelector('input[name="reps"]');
                const rirEl = row.querySelector('input[name="rir"]');
                const cell = row.querySelector('.rm-cell');
                if (!cell || !kgEl || !repsEl) return;
                const kg = parseFloat(kgEl.value);
                const reps = parseFloat(repsEl.value);
                const rirRaw = rirEl ? rirEl.value : '';
                const rir = rirRaw ? parseFloat(rirRaw) : 0;
                if (!isNaN(kg) && !isNaN(reps)) {
                    cell.textContent = (kg * (1 + 0.0333 * (reps + 1 + rir))).toFixed(1);
                } else {
                    cell.textContent = '—';
                }
            });
        }

        /* ---------- Eventos ---------- */
        document.getElementById('confirm-cancel').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onDiscard) cbs.onDiscard();
        });
        document.getElementById('confirm-save').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onSave) cbs.onSave();
        });

        document.addEventListener('DOMContentLoaded', function () {
            scheduleNotices();
            syncEditorFromContent();
        });

        document.body.addEventListener('htmx:afterSwap', function (e) {
            scheduleNotices();
            handleEditorState();
            if (e.detail && e.detail.target && e.detail.target.id === 'session-editor-wrap') {
                syncEditorFromContent();
            }
        });

        document.body.addEventListener('htmx:afterRequest', function (e) {
            scheduleNotices();
            handleEditorState();
            if (saveRequested) {
                saveRequested = false;
                if (e.detail.successful) {
                    setTimeout(function () {
                        const form = document.getElementById('session-form');
                        const fechaInput = form && form.querySelector('input[name="fecha"]');
                        const fecha = fechaInput ? fechaInput.value : '';
                        const st = document.getElementById('editor-state');
                        if (st && st.dataset.hasData !== undefined) {
                            updateDateDot(fecha, st.dataset.hasData === '1');
                        }
                        recalcRM();
                        syncEditorFromContent();
                    }, 100);
                    if (pendingNav) {
                        const target = pendingNav;
                        pendingNav = null;
                        setTimeout(function () { doNav(target, true); }, 150);
                    }
                } else if (pendingNav) {
                    pendingNav = null;
                }
            }
        });

        document.addEventListener('submit', function (e) {
            if (e.target.closest('#session-form')) saveRequested = true;
        });

        document.addEventListener('input', function (e) {
            if (e.target.closest('#session-form')) updateEditActions();
        });
        document.addEventListener('change', function (e) {
            if (e.target.closest('#session-form')) updateEditActions();
        });
    </script>
</body>
</html>
