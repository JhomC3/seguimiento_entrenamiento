<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- SortableJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            200: '#f7ccd5',
                            300: '#f0a3b3',
                            400: '#e56d88',
                            500: '#d23d5f',
                            600: '#9b1b30', // Carmesí metálico
                            700: '#800020', // Deep Vinotinto
                            800: '#66001a',
                            900: '#4d0013',
                            950: '#2d020c',
                        },
                        matte: {
                            900: '#121212',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    <div id="notice-container"></div>
    <div id="undo-result" hidden></div>

    <div id="confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Cambios sin guardar">
        <div class="confirm-card flex flex-col gap-4">
            <p id="confirm-msg" class="text-sm text-neutral-200">¿Guardar los cambios?</p>
            <div class="flex justify-end gap-2">
                <button type="button" id="confirm-cancel" class="btn-x" aria-label="Cancelar" title="Cancelar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
                <button type="button" id="confirm-save" class="btn-check" aria-label="Confirmar" title="Confirmar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                </button>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    {% if categoria_map_json %}
    <script>
        const CATEGORIA_MAP = {{ categoria_map_json | safe }};
    </script>
    {% endif %}

    <script>
        let pendingNav = null;
        let confirmCbs = null;
        let saveRequested = false;
        let sortableRows = null;
        let plantillaAppliedPending = false;
        let dragCard = null;
        let dragOrderStart = null;
        let dropHandled = false;
        let droppedOnList = false;
        let applyInFlight = null;
        let dragGhost = null;

        function scheduleNotices() {
            document.querySelectorAll('.notice:not(.scheduled)').forEach(function (el) {
                el.classList.add('scheduled');
                const delay = parseInt(el.dataset.dismiss || '3000', 10);
                setTimeout(function () {
                    el.classList.add('hide');
                    setTimeout(function () { el.remove(); }, 450);
                }, delay);
            });
        }

        /* ---------- Modal de confirmación ---------- */
        function showConfirmDialog(onSave, onDiscard) {
            confirmCbs = { onSave, onDiscard };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function hideConfirmDialog() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCbs = null;
        }

        /* ---------- Estado del editor ---------- */
        function editorEditmode() {
            return document.getElementById('session-editor')?.dataset.editmode;
        }

        function flashEditorNotice(msg, type) {
            const box = document.getElementById('editor-notice');
            if (!box) return;
            box.innerHTML = `<div class="notice ${type === 'error' ? 'notice-error' : 'notice-success'}" data-dismiss="2500">${msg}</div>`;
            scheduleNotices();
        }

        function syncEditButtons() {
            const st = document.getElementById('editor-state');
            const editor = document.getElementById('session-editor');
            if (!st || !editor) return;
            const editable = editor.dataset.editmode === '1';
            const pencil = editor.querySelector('.pencil-btn');
            if (pencil) {
                pencil.classList.toggle('on', editable);
                pencil.classList.toggle('off', !editable);
            }
            const bookmark = editor.querySelector('.save-template-btn');
            if (bookmark) bookmark.classList.toggle('on', editable);
            const trash = editor.querySelector('.delete-session-btn');
            if (trash) {
                trash.hidden = st.dataset.hasData !== '1';
                trash.classList.toggle('on', editable && st.dataset.hasData === '1');
            }
            const actions = document.getElementById('edit-actions');
            const saveBtn = actions && actions.querySelector('button[type="submit"]');
            if (saveBtn) saveBtn.disabled = !editable;
        }

        function serializeForm() {
            const form = document.getElementById('session-form');
            if (!form) return '[]';
            const rows = Array.from(form.querySelectorAll('#set-rows .set-row')).map(row => {
                const sel = row.querySelector('.ej-select');
                const inputs = Array.from(row.querySelectorAll('input')).map(i => i.value);
                return [sel ? sel.value : '', ...inputs];
            });
            return JSON.stringify(rows);
        }

        function captureBaseline() {
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.baseline = serializeForm();
        }

        function isDirty() {
            const editor = document.getElementById('session-editor');
            if (!editor || editor.dataset.baseline === undefined) return false;
            return editor.dataset.baseline !== serializeForm();
        }

        function updateEditActions() {
            const actions = document.getElementById('edit-actions');
            if (!actions) return;
            const show = editorEditmode() === '1' && isDirty();
            actions.classList.toggle('invisible', !show);
        }

        function syncEditorFromContent() {
            const editor = document.getElementById('session-editor');
            const st = document.getElementById('editor-state');
            if (!editor || !st) return;
            editor.dataset.editmode = st.dataset.readonly === '1' ? '0' : '1';
            captureBaseline();
            updateEditActions();
            syncEditButtons();
        }

        function setPanelReadonly() {
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = true; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.add('hidden'); el.hidden = true; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '0';
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            captureBaseline();
            syncSortableState();
            syncEditButtons();
        }

        function handleEditorState() {
            const st = document.getElementById('editor-state');
            if (st && st.dataset.readonly === '1') setPanelReadonly();
        }

        function enterEditMode() {
            if (editorEditmode() === '1') return;
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = false; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.remove('hidden'); el.hidden = false; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '1';
            const st = document.getElementById('editor-state');
            if (st) st.dataset.readonly = '0';
            captureBaseline();
            updateEditActions();
            syncSortableState();
            syncEditButtons();
        }

        function exitEditMode() {
            const editor = document.getElementById('session-editor');
            const fecha = editor?.querySelector('#session-form input[name="fecha"]')?.value;
            if (isDirty()) {
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(fecha || '', true); }
                );
            } else {
                doNav(fecha || '', true);
            }
        }

        function toggleEdit() {
            if (editorEditmode() === '1') {
                exitEditMode();
            } else {
                enterEditMode();
            }
        }

        /* ---------- Filas ---------- */
        function addRowAfter(btn) {
            if (editorEditmode() !== '1') return;
            const row = btn.closest('.set-row');
            const clone = row.cloneNode(true);
            clone.querySelector('.ej-select').value = '';
            clone.querySelectorAll('input').forEach(input => { input.value = ''; });
            row.after(clone);
            renumberRows();
            updateEditActions();
            fitRowsToPanel();
        }

        function removeRow(btn) {
            if (editorEditmode() !== '1') return;
            btn.closest('.set-row').remove();
            renumberRows();
            updateEditActions();
            fitRowsToPanel();
        }

        function renumberRows() {
            document.querySelectorAll('#set-rows .set-row').forEach((row, i) => {
                row.querySelector('.set-num').textContent = i + 1;
            });
        }

        /* ---------- Altura del panel: UNA medición estandarizada, constante en todo estado ---------- */
        const ROWS_VISIBLE = 17.5;
        const PANEL_BUFFER = 2;
        const ROW_BORDER_PX = 1;
        let rowHMeasured = null;
        function fitRowsToPanel() {
            const editor = document.getElementById('session-editor');
            const tbody = document.getElementById('set-rows');
            if (!editor || !tbody) return;
            const thead = editor.querySelector('.table-scroll thead');
            const theadH = thead ? thead.getBoundingClientRect().height : 20;
            if (rowHMeasured === null) {
                const row = tbody.querySelector('.set-row');
                if (row) {
                    const actions = row.querySelector('.row-actions');
                    const wasHidden = actions && actions.classList.contains('hidden');
                    if (wasHidden) actions.classList.remove('hidden');
                    rowHMeasured = row.getBoundingClientRect().height || 28;
                    if (wasHidden) actions.classList.add('hidden');
                } else {
                    rowHMeasured = 28;
                }
            }
            // Fórmula única: 18 filas + 17 bordes divide-y (1px c/u, solo filas 2..18) + margen único.
            const full = theadH + ROWS_VISIBLE * rowHMeasured + (ROWS_VISIBLE - 1) * ROW_BORDER_PX + PANEL_BUFFER;
            editor.style.setProperty('--table-h', full + 'px');
        }
        /* ---------- Drag and drop de filas ---------- */
        function initRowSortable() {
            const tbody = document.getElementById('set-rows');
            if (!tbody || typeof Sortable === 'undefined') return;
            if (sortableRows) sortableRows.destroy();
            sortableRows = Sortable.create(tbody, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                filter: 'input, select, button',
                preventOnFilter: false,
                group: { name: 'editor-rows', pull: false, put: false },
                onEnd: function () {
                    renumberRows();
                    updateEditActions();
                },
            });
            syncSortableState();
        }

        function syncSortableState() {
            if (sortableRows) sortableRows.option('disabled', editorEditmode() !== '1');
        }

        /* ---------- Drag & drop nativo de entrenos: lista -> reordenar, panel -> aplicar ---------- */
        function getDragAfterElement(container, y) {
            const cards = Array.from(container.querySelectorAll('.pt-card:not(.dragging)'));
            return cards.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset, element: child };
                return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function restoreDragOrder() {
            if (!dragCard || !dragOrderStart || !dragCard.parentElement) return;
            const list = dragCard.parentElement;
            const cards = Array.from(list.querySelectorAll('.pt-card'));
            cards.sort(function (a, b) {
                return dragOrderStart.indexOf(a.dataset.ptId) - dragOrderStart.indexOf(b.dataset.ptId);
            });
            cards.forEach(function (c) { list.appendChild(c); });
        }

        function persistDragOrder() {
            const params = new URLSearchParams();
            entrenosOrder().forEach(id => params.append('id', id));
            fetch('/plantilla/reordenar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString(),
            });
        }

        function initEntrenoDnD() {
            const panel = document.getElementById('session-editor');
            const list = document.getElementById('plantillas-list');
            if (!panel) return;

            if (!panel.dataset.dndPanelReady) {
                panel.dataset.dndPanelReady = '1';

                panel.addEventListener('dragover', function (e) {
                    if (!dragCard) return;
                    const ok = editorEditmode() === '1';
                    panel.classList.toggle('drop-target', ok);
                    if (ok) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    }
                });

                panel.addEventListener('dragleave', function (e) {
                    if (!dragCard) return;
                    if (!panel.contains(e.relatedTarget)) panel.classList.remove('drop-target');
                });

                panel.addEventListener('drop', function (e) {
                    panel.classList.remove('drop-target');
                    if (!dragCard) return;
                    if (editorEditmode() !== '1') return;
                    const id = e.dataTransfer.getData('text/plain');
                    if (!id || dropHandled) return;
                    dropHandled = true;
                    e.preventDefault();
                    const st = document.getElementById('editor-state');
                    if (st && st.dataset.hasData === '1') {
                        document.getElementById('confirm-msg').textContent = '¿Reemplazar el entrenamiento del día?';
                        showConfirmDialog(function () { aplicarPlantilla(parseInt(id, 10)); }, null);
                    } else {
                        aplicarPlantilla(parseInt(id, 10));
                    }
                });
            }

            if (!list || list.dataset.dndListReady) return;
            list.dataset.dndListReady = '1';
            list.querySelectorAll('.pt-card').forEach(card => { card.draggable = true; });

            list.addEventListener('dragstart', function (e) {
                const card = e.target.closest('.pt-card');
                if (!card) return;
                if (e.target.closest('input, select, button')) { e.preventDefault(); return; }
                e.dataTransfer.setData('text/plain', card.dataset.ptId);
                e.dataTransfer.effectAllowed = 'move';
                if (dragGhost) dragGhost.remove();
                const rect = card.getBoundingClientRect();
                dragGhost = card.cloneNode(true);
                dragGhost.style.cssText = 'position:absolute;left:-9999px;top:0;pointer-events:none;';
                document.body.appendChild(dragGhost);
                e.dataTransfer.setDragImage(dragGhost, e.clientX - rect.left, e.clientY - rect.top);
                card.classList.add('dragging');
                dragCard = card;
                dragOrderStart = entrenosOrder();
                droppedOnList = false;
                dropHandled = false;
            });

            list.addEventListener('dragover', function (e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (!dragCard) return;
                const after = getDragAfterElement(list, e.clientY);
                if (after == null) list.appendChild(dragCard);
                else list.insertBefore(dragCard, after);
            });

            list.addEventListener('drop', function (e) {
                e.preventDefault();
                droppedOnList = true;
            });

            list.addEventListener('dragend', function () {
                if (dragCard) dragCard.classList.remove('dragging');
                if (droppedOnList) {
                    if (dragOrderStart && dragOrderStart.join() !== entrenosOrder().join()) {
                        persistDragOrder();
                    }
                } else {
                    restoreDragOrder();
                }
                dragCard = null;
                dragOrderStart = null;
                droppedOnList = false;
                dropHandled = false;
                if (dragGhost) {
                    dragGhost.remove();
                    dragGhost = null;
                }
                panel.classList.remove('drop-target');
            });
        }

        /* ---------- Plantillas ---------- */
        function editorHasData() {
            return Array.from(document.querySelectorAll('#set-rows .ej-select')).some(sel => sel.value.trim() !== '');
        }

        function currentFecha() {
            if (typeof currentIso !== 'undefined' && currentIso) return currentIso;
            const form = document.getElementById('session-form');
            const input = form && form.querySelector('input[name="fecha"]');
            return input ? input.value : '';
        }

        function aplicarPlantilla(id) {
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            const fecha = currentFecha();
            if (!fecha) return;
            const key = `${id}|${fecha}`;
            if (applyInFlight === key) return;
            applyInFlight = key;
            setTimeout(function () { if (applyInFlight === key) applyInFlight = null; }, 600);
            htmx.ajax('GET', `/plantilla/aplicar/${id}?fecha=${fecha}`, { target: '#session-editor-wrap', swap: 'none' });
        }

        function eliminarPlantilla(id, nombre) {
            if (!confirm(`¿Eliminar el entreno "${nombre}"?`)) return;
            htmx.ajax('POST', `/plantilla/eliminar/${id}`, { target: 'body', swap: 'none' });
        }

        function eliminarSesion() {
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            const fecha = currentFecha();
            if (!fecha) return;
            document.getElementById('confirm-msg').textContent = '¿Eliminar el entreno de esta fecha?';
            showConfirmDialog(function () {
                saveRequested = true;
                htmx.ajax('POST', '/entrenamiento/session/eliminar', { values: { fecha: fecha }, target: 'body', swap: 'none' });
            }, null);
        }

        function editarPlantilla(id) {
            htmx.ajax('GET', `/plantillas?editar=${id}`, { target: '#plantillas-section', swap: 'innerHTML' });
        }

        function refreshPlantillas() {
            htmx.ajax('GET', '/plantillas', { target: '#plantillas-section', swap: 'innerHTML' });
        }

        function suggestedTemplateName() {
            const cats = new Set();
            const seen = new Set();
            document.querySelectorAll('#set-rows .ej-select').forEach(sel => {
                const v = sel.value.trim();
                if (!v || seen.has(v.toLowerCase())) return;
                seen.add(v.toLowerCase());
                const c = CATEGORIA_MAP[v.toLowerCase()];
                if (c) cats.add(c.toUpperCase());
            });
            if (!cats.size) return '';
            const hE = cats.has('EMPUJE'), hT = cats.has('TIRON'), hP = cats.has('PIERNA');
            if (hP && (hE || hT)) return 'Full Body';
            if (hE && hT) return 'Torso';
            if (hT) return 'Jalón';
            if (hE) return 'Empuje';
            if (hP) return 'Pierna';
            return 'Core';
        }

        function syncTemplateEjercicios() {
            const wrap = document.getElementById('save-template-form-wrap');
            const form = wrap && document.getElementById('save-template-form');
            if (!form || wrap.classList.contains('hidden')) return;
            form.querySelectorAll('input[name="ejercicio"]').forEach(el => el.remove());
            const seen = new Set();
            document.querySelectorAll('#set-rows .ej-select').forEach(sel => {
                const v = sel.value.trim();
                if (!v || seen.has(v.toLowerCase())) return;
                seen.add(v.toLowerCase());
                const inp = document.createElement('input');
                inp.type = 'hidden';
                inp.name = 'ejercicio';
                inp.value = v;
                form.appendChild(inp);
            });
        }

        function setEntrenoBtnVisible(visible) {
            const btn = document.querySelector('#session-editor .save-template-btn');
            if (btn) btn.hidden = !visible;
        }

        function openEntrenoForm() {
            const wrap = document.getElementById('save-template-form-wrap');
            if (!wrap) return;
            const input = wrap.querySelector('input[name="nombre"]');
            if (input && !input.value) input.value = suggestedTemplateName();
            wrap.classList.remove('hidden');
            setEntrenoBtnVisible(false);
            syncTemplateEjercicios();
            if (input) input.focus();
        }

        function guardarPlantillaToggle(force) {
            const wrap = document.getElementById('save-template-form-wrap');
            if (!wrap) return;
            if (force === false) {
                wrap.classList.add('hidden');
                setEntrenoBtnVisible(true);
                return;
            }
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            if (!editorHasData()) {
                flashEditorNotice('No hay nada que guardar como entreno.', 'error');
                return;
            }
            if (wrap.classList.contains('hidden')) {
                document.getElementById('confirm-msg').textContent = '¿Desea crear un nuevo entrenamiento?';
                showConfirmDialog(function () { openEntrenoForm(); }, null);
            } else {
                wrap.classList.add('hidden');
                setEntrenoBtnVisible(true);
            }
        }

        function confirmEntrenoSave() {
            const form = document.getElementById('save-template-form');
            if (!form) return;
            const nombre = form.querySelector('input[name="nombre"]').value.trim();
            if (!nombre) {
                form.requestSubmit();
                return;
            }
            const exists = Array.from(document.querySelectorAll('#plantillas-section [data-pt-nombre]'))
                .some(el => el.dataset.ptNombre.toLowerCase() === nombre.toLowerCase());
            document.getElementById('confirm-msg').textContent = exists
                ? `Ya existe el entreno '${nombre}'. ¿Reemplazarlo?`
                : `¿Guardar el entreno '${nombre}'?`;
            showConfirmDialog(function () {
                form.requestSubmit();
            }, null);
        }

        /* ---------- Deshacer (Ctrl+Z / botón ↶) ---------- */
        function undoAction() {
            saveRequested = true;
            const fecha = currentFecha();
            htmx.ajax('POST', '/undo', { values: { fecha: fecha }, target: 'body', swap: 'none' });
        }

        function ptAddRow(btn) {
            const container = document.getElementById('plantilla-edit-rows');
            const first = container && container.querySelector('.pt-row');
            if (!container || !first) return;
            const clone = first.cloneNode(true);
            clone.querySelector('.pt-select').value = '';
            container.appendChild(clone);
        }

        function ptRemoveRow(btn) {
            const container = document.getElementById('plantilla-edit-rows');
            if (!container || container.querySelectorAll('.pt-row').length <= 1) return;
            btn.closest('.pt-row').remove();
        }

        function initTemplateSortable() {
            const container = document.getElementById('plantilla-edit-rows');
            if (container && typeof Sortable !== 'undefined' && !container.dataset.sortableReady) {
                container.dataset.sortableReady = '1';
                Sortable.create(container, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    filter: 'input, select, button',
                    preventOnFilter: false,
                });
            }
        }

        function entrenosOrder() {
            return Array.from(document.querySelectorAll('#plantillas-list .pt-card')).map(el => el.dataset.ptId);
        }

        /* ---------- Guardar ---------- */
        function submitSave() {
            const form = document.getElementById('session-form');
            if (form) form.requestSubmit();
        }

        /* ---------- Navegación entre fechas ---------- */
        function doNav(iso, force) {
            if (!iso) return;
            if (force) {
                pendingNav = null;
            } else if (pendingNav) {
                return;
            }
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            if (typeof currentIso !== 'undefined') currentIso = iso;
            document.querySelectorAll('.date-num.selected').forEach(b => b.classList.remove('selected'));
            const btn = document.querySelector(`.date-num[data-iso="${iso}"]`);
            if (btn) btn.classList.add('selected');
            htmx.ajax('GET', `/fecha/editor?fecha=${iso}`, { target: '#session-editor-wrap', swap: 'innerHTML' });
            if (btn) btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }

        function requestNavigate(iso) {
            if (isDirty()) {
                pendingNav = iso;
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(iso, true); }
                );
            } else {
                doNav(iso);
            }
        }

        /* ---------- Sincronización post-guardado ---------- */
        function updateDateDot(fecha, has) {
            const btn = document.querySelector(`.date-num[data-iso="${fecha}"]`);
            if (!btn) return;
            const dot = btn.querySelector('.date-dot');
            if (has) {
                if (!dot) btn.insertAdjacentHTML('beforeend', '<span class="date-dot"></span>');
            } else if (dot) {
                dot.remove();
            }
        }

        function fmtNum(v) {
            const rounded = Math.round(v * 10) / 10;
            return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
        }

        function recalcRM() {
            document.querySelectorAll('#set-rows .set-row').forEach(function (row) {
                const kgEl = row.querySelector('input[name="kg"]');
                const repsEl = row.querySelector('input[name="reps"]');
                const rirEl = row.querySelector('input[name="rir"]');
                const cell = row.querySelector('.rm-cell');
                if (!cell || !kgEl || !repsEl) return;
                const kg = parseFloat(kgEl.value);
                const reps = parseFloat(repsEl.value);
                const rirRaw = rirEl ? rirEl.value : '';
                const rir = rirRaw ? parseFloat(rirRaw) : 0;
                if (!isNaN(kg) && !isNaN(reps)) {
                    cell.textContent = fmtNum(kg * (1 + 0.0333 * (reps + 1 + rir)));
                } else {
                    cell.textContent = '—';
                }
            });
        }

        /* ---------- Eventos ---------- */
        document.getElementById('confirm-cancel').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onDiscard) cbs.onDiscard();
        });
        document.getElementById('confirm-save').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onSave) cbs.onSave();
        });

        document.addEventListener('DOMContentLoaded', function () {
            scheduleNotices();
            syncEditorFromContent();
            initRowSortable();
            initTemplateSortable();
            initEntrenoDnD();
            fitRowsToPanel();
        });

        document.body.addEventListener('htmx:afterSwap', function (e) {
            scheduleNotices();
            handleEditorState();
            if (e.detail && e.detail.target) {
                if (e.detail.target.id === 'session-editor-wrap') {
                    syncEditorFromContent();
                    if (document.getElementById('plantilla-applied')) {
                        document.getElementById('plantilla-applied').remove();
                        plantillaAppliedPending = true;
                    }
                    initRowSortable();
                    fitRowsToPanel();
                } else if (e.detail.target.id === 'plantillas-section') {
                    initTemplateSortable();
                }
            }
        });

        document.body.addEventListener('htmx:afterSettle', function (e) {
            if (!plantillaAppliedPending) return;
            const target = e.detail && e.detail.target;
            if (target && (target.id === 'session-editor-wrap' || target === document.body)) {
                plantillaAppliedPending = false;
                const editor = document.getElementById('session-editor');
                if (editor) {
                    editor.dataset.baseline = '';
                    updateEditActions();
                }
            }
        });

        document.body.addEventListener('htmx:afterRequest', function (e) {
            scheduleNotices();
            handleEditorState();
            initTemplateSortable();
            initEntrenoDnD();
            const ptForm = e.detail && e.detail.elt && e.detail.elt.closest
                ? e.detail.elt.closest('#save-template-form')
                : null;
            if (ptForm && e.detail.successful) {
                guardarPlantillaToggle(false);
            }
            if (saveRequested) {
                saveRequested = false;
                const undoRes = document.getElementById('undo-result');
                if (undoRes && undoRes.dataset.fecha) {
                    updateDateDot(undoRes.dataset.fecha, undoRes.dataset.hasData === '1');
                    undoRes.removeAttribute('data-fecha');
                    undoRes.removeAttribute('data-has-data');
                }
                const outcome = document.getElementById('save-outcome');
                if (e.detail.successful && outcome && outcome.dataset.ok === '1') {
                    setTimeout(function () {
                        const form = document.getElementById('session-form');
                        const fechaInput = form && form.querySelector('input[name="fecha"]');
                        const fecha = fechaInput ? fechaInput.value : '';
                        const st = document.getElementById('editor-state');
                        if (st && st.dataset.hasData !== undefined) {
                            updateDateDot(fecha, st.dataset.hasData === '1');
                            syncEditButtons();
                        }
                        recalcRM();
                        syncEditorFromContent();
                        fitRowsToPanel();
                    }, 100);
                    if (pendingNav) {
                        const target = pendingNav;
                        pendingNav = null;
                        setTimeout(function () { doNav(target, true); }, 150);
                    }
                } else {
                    pendingNav = null;
                }
            }
        });

        document.addEventListener('submit', function (e) {
            const form = e.target.closest('#session-form');
            if (!form) return;
            if (editorEditmode() !== '1') {
                e.preventDefault();
                return;
            }
            saveRequested = true;
        }, true);

        document.addEventListener('input', function (e) {
            if (e.target.closest('#session-form')) {
                updateEditActions();
                syncTemplateEjercicios();
            }
        });
        document.addEventListener('change', function (e) {
            if (e.target.closest('#session-form')) {
                updateEditActions();
                syncTemplateEjercicios();
            }
        });

        document.addEventListener('keydown', function (e) {
            const inField = e.target.closest && e.target.closest('input, textarea');
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (inField) return;
                e.preventDefault();
                undoAction();
                return;
            }
            if (e.key === 'Enter' && inField && e.target.closest('#save-template-form input[name="nombre"]')) {
                e.preventDefault();
                confirmEntrenoSave();
            }
        }, true);
    </script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
