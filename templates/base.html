<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- SortableJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            50: '#fdf2f4',
                            100: '#fbe5e9',
                            200: '#f7ccd5',
                            300: '#f0a3b3',
                            400: '#e56d88',
                            500: '#d23d5f',
                            600: '#9b1b30', // Carmesí metálico
                            700: '#800020', // Deep Vinotinto
                            800: '#66001a',
                            900: '#4d0013',
                            950: '#2d020c',
                        },
                        matte: {
                            900: '#121212',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            background-color: #0a0a0a;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
        
        /* Remove default browser focus/active outlines */
        button {
            -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible, button:active {
            outline: none !important;
        }
        
        /* Neon glow effects */
        .neon-border {
            box-shadow: 
                0 0 20px rgba(255, 30, 70, 0.10),
                0 0 40px rgba(255, 30, 70, 0.06),
                0 0 80px rgba(255, 30, 70, 0.03);
        }
        .metallic-border {
            position: relative;
            background-clip: padding-box !important;
        }
        .metallic-border::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: inherit;
            background: linear-gradient(
                145deg,
                rgba(220, 220, 235, 0.3) 0%,
                rgba(155, 27, 48, 0.4) 35%,
                rgba(220, 220, 235, 0.1) 65%,
                rgba(80, 80, 100, 0.2) 100%
            );
            z-index: -1;
            pointer-events: none;
        }
        .neon-title {
            text-shadow: 
                0 0 4px rgba(255, 30, 70, 0.9),
                0 0 12px rgba(255, 30, 70, 0.5),
                0 0 25px rgba(255, 30, 70, 0.25);
        }

        /* Navegador de fechas */
        .date-num {
            position: relative;
            flex: none;
            min-width: 26px;
            padding: 6px 4px 9px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: #a3a3a3;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            transition: color .15s;
            cursor: pointer;
        }
        .date-num:hover {
            color: #fff;
        }
        .date-num.selected {
            color: #e56d88;
            background: rgba(155, 27, 48, 0.25);
        }
        .date-dot {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            border-radius: 9999px;
            background: #e56d88;
        }
        .nav-arrow {
            flex: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid #262626;
            background: #0a0a0a;
            color: #a3a3a3;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all .15s;
        }
        .nav-arrow:hover {
            border-color: #9b1b30;
            color: #e56d88;
        }
        .date-input {
            flex: none;
            width: 118px;
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 11px;
            color: #e5e5e5;
        }
        .date-input:focus {
            border-color: #9b1b30;
            outline: none;
        }
        .today-btn {
            flex: none;
            height: 30px;
            padding: 0 12px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(163, 163, 163, 0.45);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: color .15s;
        }
        .today-btn:hover {
            color: #e56d88;
        }
        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Botones +/− de filas (overlay glass, visibles al hover) */
        .row-btn {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            transition: all .15s;
        }
        .row-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Spinners numéricos: se mantienen nativos, solo baja un poco su color al aparecer */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            background-color: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
        }

        /* Avisos: flotantes fijos arriba-centro, superpuestos, sin afectar layout */
        #notice-container {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }
        .notice {
            width: fit-content;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 11px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity .4s ease;
        }
        .notice-success {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: rgba(110, 231, 183, 0.9);
        }
        .notice-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: rgba(252, 165, 165, 0.95);
        }
        .notice.hide {
            opacity: 0;
        }

        /* Aviso del editor de sesión: superpuesto arriba del panel, más grande y atenuado */
        #editor-notice {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 40;
            pointer-events: none;
        }
        #editor-notice .notice {
            font-size: 13px;
            padding: 10px 20px;
            border-radius: 10px;
        }
        #editor-notice .notice-success {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.12);
            color: rgba(110, 231, 183, 0.6);
        }
        #editor-notice .notice-error {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.12);
            color: rgba(252, 165, 165, 0.6);
        }

        /* Lápiz de edición: encendido = editable, apagado = solo lectura */
        .edit-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: color .15s, background .15s, box-shadow .15s;
            cursor: pointer;
        }
        .edit-toggle.on {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
        .edit-toggle.off {
            color: rgba(255, 255, 255, 0.35);
        }
        .edit-toggle.off:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        .save-template-btn {
            color: rgba(255, 255, 255, 0.35);
        }
        .save-template-btn.on {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
        .delete-session-btn {
            color: rgba(255, 255, 255, 0.30);
        }
        .delete-session-btn.on {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        /* Botones de confirmación: ✓ (guardar, derecha) y ✗ (cancelar, izquierda) */
        .btn-check,
        .btn-x {
            flex: none;
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all .15s;
        }
        .btn-check:hover:not(:disabled) {
            background: rgba(16, 185, 129, 0.14);
            border-color: rgba(16, 185, 129, 0.45);
            color: #6ee7b7;
        }
        .btn-x:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fca5a5;
        }
        .btn-check:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Destino de drop de entrenos (editor en modo editable) */
        #session-editor.drop-target {
            outline: 2px dashed rgba(229, 109, 136, 0.55);
            outline-offset: -2px;
        }
        #session-editor .sortable-placeholder {
            display: none;
        }

        /* Tarjetas de entrenos: arrastrables desde cualquier zona no interactiva */
        #plantillas-list .pt-card {
            cursor: grab;
        }
        #plantillas-list .pt-card.sortable-chosen {
            cursor: grabbing;
        }

        /* Badges de clasificación de plantillas */
        .cls-badge {
            flex: none;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.1em;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .cls-empuje { color: #e56d88; border-color: rgba(155, 27, 48, 0.55); background: rgba(155, 27, 48, 0.18); }
        .cls-jalon { color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35); background: rgba(56, 189, 248, 0.1); }
        .cls-pierna { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); background: rgba(16, 185, 129, 0.1); }
        .cls-torso { color: #c4b5fd; border-color: rgba(139, 92, 246, 0.35); background: rgba(139, 92, 246, 0.1); }
        .cls-full-body { color: #fcd34d; border-color: rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.1); }
        .cls-core, .cls-sin-clasificar { color: #a3a3a3; border-color: rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); }

        /* Botones de gestión de plantillas */
        .pt-btn {
            height: 22px;
            padding: 0 8px;
            border-radius: 6px;
            border: 1px solid #262626;
            background: #0a0a0a;
            color: #a3a3a3;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .15s;
        }
        .pt-btn:hover {
            border-color: #9b1b30;
            color: #e56d88;
        }
        .pt-btn-burgundy {
            border-color: rgba(155, 27, 48, 0.55);
            color: #e56d88;
        }
        .pt-btn-burgundy:hover {
            background: rgba(155, 27, 48, 0.2);
        }

        /* Modal de confirmación de cambios sin guardar */
        #confirm-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 60;
        }
        #confirm-modal .confirm-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 20px;
            width: min(380px, calc(100vw - 40px));
            box-shadow: 0 0 24px rgba(155, 27, 48, 0.25);
        }
        #confirm-modal.hidden {
            display: none;
        }

        /* Hover de fila: solo cuando el modo editable está activo, en cualquier fecha */
        #session-editor[data-editmode="1"] .set-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* Drag and drop de filas (solo en modo editable) */
        #session-editor[data-editmode="1"] .set-row {
            cursor: grab;
        }
        #session-editor[data-editmode="1"] .set-row.sortable-chosen {
            cursor: grabbing;
        }
        #session-editor .sortable-ghost {
            opacity: 0.4;
            background: rgba(155, 27, 48, 0.2);
        }
        #session-editor .sortable-chosen {
            background: rgba(255, 255, 255, 0.06);
        }

        /* Tabla de sesión: altura fija estable (variable en el panel, sobrevive a los swaps) */
        #session-editor .table-scroll {
            height: var(--table-h, 538px);
            scrollbar-width: thin;
            scrollbar-color: #333 #0a0a0a;
        }
        #session-editor .table-scroll thead th {
            position: sticky;
            top: 0;
            background: #171717;
            z-index: 5;
        }
    </style>
</head>
<body class="bg-matte-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-burgundy-700 selection:text-white">
    <div id="notice-container"></div>
    <div id="undo-result" hidden></div>

    <div id="confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Cambios sin guardar">
        <div class="confirm-card flex flex-col gap-4">
            <p id="confirm-msg" class="text-sm text-neutral-200">¿Guardar los cambios?</p>
            <div class="flex justify-end gap-2">
                <button type="button" id="confirm-cancel" class="btn-x" aria-label="Cancelar" title="Cancelar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
                <button type="button" id="confirm-save" class="btn-check" aria-label="Confirmar" title="Confirmar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                </button>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    {% if categoria_map_json %}
    <script>
        const CATEGORIA_MAP = {{ categoria_map_json | safe }};
    </script>
    {% endif %}

    <script>
        let pendingNav = null;
        let confirmCbs = null;
        let saveRequested = false;
        let sortableRows = null;
        let dropInFlight = false;
        let plantillaAppliedPending = false;
        let entrenosOrderStart = null;

        function scheduleNotices() {
            document.querySelectorAll('.notice:not(.scheduled)').forEach(function (el) {
                el.classList.add('scheduled');
                const delay = parseInt(el.dataset.dismiss || '3000', 10);
                setTimeout(function () {
                    el.classList.add('hide');
                    setTimeout(function () { el.remove(); }, 450);
                }, delay);
            });
        }

        /* ---------- Modal de confirmación ---------- */
        function showConfirmDialog(onSave, onDiscard) {
            confirmCbs = { onSave, onDiscard };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function hideConfirmDialog() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCbs = null;
        }

        /* ---------- Estado del editor ---------- */
        function editorEditmode() {
            return document.getElementById('session-editor')?.dataset.editmode;
        }

        function flashEditorNotice(msg, type) {
            const box = document.getElementById('editor-notice');
            if (!box) return;
            box.innerHTML = `<div class="notice ${type === 'error' ? 'notice-error' : 'notice-success'}" data-dismiss="2500">${msg}</div>`;
            scheduleNotices();
        }

        function syncEditButtons() {
            const st = document.getElementById('editor-state');
            const editor = document.getElementById('session-editor');
            if (!st || !editor) return;
            const editable = editor.dataset.editmode === '1';
            const pencil = editor.querySelector('.pencil-btn');
            if (pencil) {
                pencil.classList.toggle('on', editable);
                pencil.classList.toggle('off', !editable);
            }
            const bookmark = editor.querySelector('.save-template-btn');
            if (bookmark) bookmark.classList.toggle('on', editable);
            const trash = editor.querySelector('.delete-session-btn');
            if (trash) {
                trash.hidden = st.dataset.hasData !== '1';
                trash.classList.toggle('on', editable && st.dataset.hasData === '1');
            }
            const actions = document.getElementById('edit-actions');
            const saveBtn = actions && actions.querySelector('button[type="submit"]');
            if (saveBtn) saveBtn.disabled = !editable;
        }

        function serializeForm() {
            const form = document.getElementById('session-form');
            if (!form) return '[]';
            const rows = Array.from(form.querySelectorAll('#set-rows .set-row')).map(row => {
                const sel = row.querySelector('.ej-select');
                const inputs = Array.from(row.querySelectorAll('input')).map(i => i.value);
                return [sel ? sel.value : '', ...inputs];
            });
            return JSON.stringify(rows);
        }

        function captureBaseline() {
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.baseline = serializeForm();
        }

        function isDirty() {
            const editor = document.getElementById('session-editor');
            if (!editor || editor.dataset.baseline === undefined) return false;
            return editor.dataset.baseline !== serializeForm();
        }

        function updateEditActions() {
            const actions = document.getElementById('edit-actions');
            if (!actions) return;
            const show = editorEditmode() === '1' && isDirty();
            actions.classList.toggle('invisible', !show);
        }

        function syncEditorFromContent() {
            const editor = document.getElementById('session-editor');
            const st = document.getElementById('editor-state');
            if (!editor || !st) return;
            editor.dataset.editmode = st.dataset.readonly === '1' ? '0' : '1';
            captureBaseline();
            updateEditActions();
            syncEditButtons();
        }

        function setPanelReadonly() {
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = true; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.add('hidden'); el.hidden = true; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '0';
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            captureBaseline();
            syncSortableState();
            syncEditButtons();
        }

        function handleEditorState() {
            const st = document.getElementById('editor-state');
            if (st && st.dataset.readonly === '1') setPanelReadonly();
        }

        function enterEditMode() {
            if (editorEditmode() === '1') return;
            const form = document.getElementById('session-form');
            if (!form) return;
            form.querySelectorAll('input, select').forEach(el => { el.disabled = false; });
            form.querySelectorAll('.row-actions').forEach(el => { el.classList.remove('hidden'); el.hidden = false; });
            const editor = document.getElementById('session-editor');
            if (editor) editor.dataset.editmode = '1';
            const st = document.getElementById('editor-state');
            if (st) st.dataset.readonly = '0';
            captureBaseline();
            updateEditActions();
            syncSortableState();
            syncEditButtons();
        }

        function exitEditMode() {
            const editor = document.getElementById('session-editor');
            const fecha = editor?.querySelector('#session-form input[name="fecha"]')?.value;
            if (isDirty()) {
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(fecha || '', true); }
                );
            } else {
                doNav(fecha || '', true);
            }
        }

        function toggleEdit() {
            if (editorEditmode() === '1') {
                exitEditMode();
            } else {
                enterEditMode();
            }
        }

        /* ---------- Filas ---------- */
        function addRowAfter(btn) {
            if (editorEditmode() !== '1') return;
            const row = btn.closest('.set-row');
            const clone = row.cloneNode(true);
            clone.querySelector('.ej-select').value = '';
            clone.querySelectorAll('input').forEach(input => { input.value = ''; });
            row.after(clone);
            renumberRows();
            updateEditActions();
        }

        function removeRow(btn) {
            if (editorEditmode() !== '1') return;
            btn.closest('.set-row').remove();
            renumberRows();
            updateEditActions();
        }

        function renumberRows() {
            document.querySelectorAll('#set-rows .set-row').forEach((row, i) => {
                row.querySelector('.set-num').textContent = i + 1;
            });
        }

        /* ---------- Altura del panel: fija (variable en el panel estable), siempre caben 18 filas ---------- */
        const ROWS_VISIBLE = 18;
        function fitRowsToPanel() {
            const editor = document.getElementById('session-editor');
            const tbody = document.getElementById('set-rows');
            if (!editor || !tbody) return;
            const row = tbody.querySelector('.set-row');
            const rowH = row ? row.offsetHeight : 28;
            const thead = editor.querySelector('.table-scroll thead');
            const theadH = thead ? thead.offsetHeight : 20;
            const full = theadH + ROWS_VISIBLE * rowH;
            const nrows = tbody.querySelectorAll('.set-row').length;
            const table = editor.querySelector('.table-scroll table');
            const tableH = table ? table.offsetHeight : 0;
            editor.style.setProperty('--table-h', (nrows > ROWS_VISIBLE ? full : Math.max(full, tableH)) + 'px');
        }
        /* ---------- Drag and drop de filas ---------- */
        function initRowSortable() {
            const tbody = document.getElementById('set-rows');
            if (!tbody || typeof Sortable === 'undefined') return;
            if (sortableRows) sortableRows.destroy();
            sortableRows = Sortable.create(tbody, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                filter: 'input, select, button',
                preventOnFilter: false,
                group: { name: 'editor-rows', pull: false, put: false },
                onEnd: function () {
                    renumberRows();
                    updateEditActions();
                },
            });
            syncSortableState();
        }

        function syncSortableState() {
            if (sortableRows) sortableRows.option('disabled', editorEditmode() !== '1');
        }

        /* ---------- Drop zone de entrenos: todo el panel (no la tabla) ---------- */
        function initPanelDropZone() {
            const panel = document.getElementById('session-editor');
            if (!panel || typeof Sortable === 'undefined' || panel.dataset.dropReady) return;
            panel.dataset.dropReady = '1';
            Sortable.create(panel, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                draggable: '.pt-card',
                group: { name: 'editor-panel', pull: false, put: ['entrenos'] },
                onMove: function (evt) {
                    const ok = editorEditmode() === '1';
                    panel.classList.toggle('drop-target', ok);
                    return ok;
                },
                onEnd: function () {
                    panel.classList.remove('drop-target');
                },
                onAdd: function (evt) {
                    const item = evt.item;
                    const id = item && item.dataset ? item.dataset.ptId : null;
                    if (item) item.remove();
                    if (!id) return;
                    if (editorEditmode() !== '1') {
                        flashEditorNotice('Activa el modo editable primero.', 'error');
                        return;
                    }
                    panel.classList.add('drop-target');
                    if (dropInFlight) return;
                    dropInFlight = true;
                    setTimeout(function () { dropInFlight = false; }, 500);
                    const st = document.getElementById('editor-state');
                    if (st && st.dataset.hasData === '1') {
                        document.getElementById('confirm-msg').textContent = '¿Reemplazar el entrenamiento del día?';
                        showConfirmDialog(function () { aplicarPlantilla(parseInt(id, 10)); }, null);
                    } else {
                        aplicarPlantilla(parseInt(id, 10));
                    }
                },
            });
        }

        /* ---------- Plantillas ---------- */
        function editorHasData() {
            return Array.from(document.querySelectorAll('#set-rows .ej-select')).some(sel => sel.value.trim() !== '');
        }

        function currentFecha() {
            if (typeof currentIso !== 'undefined' && currentIso) return currentIso;
            const form = document.getElementById('session-form');
            const input = form && form.querySelector('input[name="fecha"]');
            return input ? input.value : '';
        }

        function aplicarPlantilla(id) {
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            const fecha = currentFecha();
            if (!fecha) return;
            htmx.ajax('GET', `/plantilla/aplicar/${id}?fecha=${fecha}`, { target: '#session-editor-wrap', swap: 'none' });
        }

        function eliminarPlantilla(id, nombre) {
            if (!confirm(`¿Eliminar el entreno "${nombre}"?`)) return;
            htmx.ajax('POST', `/plantilla/eliminar/${id}`, { target: 'body', swap: 'none' });
        }

        function eliminarSesion() {
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            const fecha = currentFecha();
            if (!fecha) return;
            document.getElementById('confirm-msg').textContent = '¿Eliminar el entreno de esta fecha?';
            showConfirmDialog(function () {
                saveRequested = true;
                htmx.ajax('POST', '/entrenamiento/session/eliminar', { values: { fecha: fecha }, target: 'body', swap: 'none' });
            }, null);
        }

        function editarPlantilla(id) {
            htmx.ajax('GET', `/plantillas?editar=${id}`, { target: '#plantillas-section', swap: 'innerHTML' });
        }

        function refreshPlantillas() {
            htmx.ajax('GET', '/plantillas', { target: '#plantillas-section', swap: 'innerHTML' });
        }

        function suggestedTemplateName() {
            const cats = new Set();
            const seen = new Set();
            document.querySelectorAll('#set-rows .ej-select').forEach(sel => {
                const v = sel.value.trim();
                if (!v || seen.has(v.toLowerCase())) return;
                seen.add(v.toLowerCase());
                const c = CATEGORIA_MAP[v.toLowerCase()];
                if (c) cats.add(c.toUpperCase());
            });
            if (!cats.size) return '';
            const hE = cats.has('EMPUJE'), hT = cats.has('TIRON'), hP = cats.has('PIERNA');
            if (hP && (hE || hT)) return 'Full Body';
            if (hE && hT) return 'Torso';
            if (hT) return 'Jalón';
            if (hE) return 'Empuje';
            if (hP) return 'Pierna';
            return 'Core';
        }

        function syncTemplateEjercicios() {
            const wrap = document.getElementById('save-template-form-wrap');
            const form = wrap && document.getElementById('save-template-form');
            if (!form || wrap.classList.contains('hidden')) return;
            form.querySelectorAll('input[name="ejercicio"]').forEach(el => el.remove());
            const seen = new Set();
            document.querySelectorAll('#set-rows .ej-select').forEach(sel => {
                const v = sel.value.trim();
                if (!v || seen.has(v.toLowerCase())) return;
                seen.add(v.toLowerCase());
                const inp = document.createElement('input');
                inp.type = 'hidden';
                inp.name = 'ejercicio';
                inp.value = v;
                form.appendChild(inp);
            });
        }

        function setEntrenoBtnVisible(visible) {
            const btn = document.querySelector('#session-editor .save-template-btn');
            if (btn) btn.hidden = !visible;
        }

        function openEntrenoForm() {
            const wrap = document.getElementById('save-template-form-wrap');
            if (!wrap) return;
            const input = wrap.querySelector('input[name="nombre"]');
            if (input && !input.value) input.value = suggestedTemplateName();
            wrap.classList.remove('hidden');
            setEntrenoBtnVisible(false);
            syncTemplateEjercicios();
            if (input) input.focus();
        }

        function guardarPlantillaToggle(force) {
            const wrap = document.getElementById('save-template-form-wrap');
            if (!wrap) return;
            if (force === false) {
                wrap.classList.add('hidden');
                setEntrenoBtnVisible(true);
                return;
            }
            if (editorEditmode() !== '1') {
                flashEditorNotice('Activa el modo editable primero.', 'error');
                return;
            }
            if (!editorHasData()) {
                flashEditorNotice('No hay nada que guardar como entreno.', 'error');
                return;
            }
            if (wrap.classList.contains('hidden')) {
                document.getElementById('confirm-msg').textContent = '¿Desea crear un nuevo entrenamiento?';
                showConfirmDialog(function () { openEntrenoForm(); }, null);
            } else {
                wrap.classList.add('hidden');
                setEntrenoBtnVisible(true);
            }
        }

        function confirmEntrenoSave() {
            const form = document.getElementById('save-template-form');
            if (!form) return;
            const nombre = form.querySelector('input[name="nombre"]').value.trim();
            if (!nombre) {
                form.requestSubmit();
                return;
            }
            const exists = Array.from(document.querySelectorAll('#plantillas-section [data-pt-nombre]'))
                .some(el => el.dataset.ptNombre.toLowerCase() === nombre.toLowerCase());
            document.getElementById('confirm-msg').textContent = exists
                ? `Ya existe el entreno '${nombre}'. ¿Reemplazarlo?`
                : `¿Guardar el entreno '${nombre}'?`;
            showConfirmDialog(function () {
                form.requestSubmit();
            }, null);
        }

        /* ---------- Deshacer (Ctrl+Z / botón ↶) ---------- */
        function undoAction() {
            saveRequested = true;
            const fecha = currentFecha();
            htmx.ajax('POST', '/undo', { values: { fecha: fecha }, target: 'body', swap: 'none' });
        }

        function ptAddRow(btn) {
            const container = document.getElementById('plantilla-edit-rows');
            const first = container && container.querySelector('.pt-row');
            if (!container || !first) return;
            const clone = first.cloneNode(true);
            clone.querySelector('.pt-select').value = '';
            container.appendChild(clone);
        }

        function ptRemoveRow(btn) {
            const container = document.getElementById('plantilla-edit-rows');
            if (!container || container.querySelectorAll('.pt-row').length <= 1) return;
            btn.closest('.pt-row').remove();
        }

        function initTemplateSortable() {
            const container = document.getElementById('plantilla-edit-rows');
            if (container && typeof Sortable !== 'undefined' && !container.dataset.sortableReady) {
                container.dataset.sortableReady = '1';
                Sortable.create(container, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    filter: 'input, select, button',
                    preventOnFilter: false,
                });
            }
            const list = document.getElementById('plantillas-list');
            if (list && typeof Sortable !== 'undefined' && !list.dataset.sortableReady) {
                list.dataset.sortableReady = '1';
                Sortable.create(list, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    filter: 'input, select, button',
                    preventOnFilter: false,
                    draggable: '.pt-card',
                    group: { name: 'entrenos', pull: 'clone', put: false },
                    onStart: function () { entrenosOrderStart = entrenosOrder(); },
                    onEnd: function () {
                        const now = entrenosOrder();
                        if (entrenosOrderStart && entrenosOrderStart.join() !== now.join()) {
                            const params = new URLSearchParams();
                            now.forEach(id => params.append('id', id));
                            fetch('/plantilla/reordenar', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: params.toString(),
                            });
                        }
                        entrenosOrderStart = null;
                    },
                });
            }
        }

        function entrenosOrder() {
            return Array.from(document.querySelectorAll('#plantillas-list .pt-card')).map(el => el.dataset.ptId);
        }

        /* ---------- Guardar ---------- */
        function submitSave() {
            const form = document.getElementById('session-form');
            if (form) form.requestSubmit();
        }

        /* ---------- Navegación entre fechas ---------- */
        function doNav(iso, force) {
            if (!iso) return;
            if (force) {
                pendingNav = null;
            } else if (pendingNav) {
                return;
            }
            const actions = document.getElementById('edit-actions');
            if (actions) actions.classList.add('invisible');
            if (typeof currentIso !== 'undefined') currentIso = iso;
            document.querySelectorAll('.date-num.selected').forEach(b => b.classList.remove('selected'));
            const btn = document.querySelector(`.date-num[data-iso="${iso}"]`);
            if (btn) btn.classList.add('selected');
            htmx.ajax('GET', `/fecha/editor?fecha=${iso}`, { target: '#session-editor-wrap', swap: 'innerHTML' });
            if (btn) btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }

        function requestNavigate(iso) {
            if (isDirty()) {
                pendingNav = iso;
                showConfirmDialog(
                    function () { submitSave(); },
                    function () { doNav(iso, true); }
                );
            } else {
                doNav(iso);
            }
        }

        /* ---------- Sincronización post-guardado ---------- */
        function updateDateDot(fecha, has) {
            const btn = document.querySelector(`.date-num[data-iso="${fecha}"]`);
            if (!btn) return;
            const dot = btn.querySelector('.date-dot');
            if (has) {
                if (!dot) btn.insertAdjacentHTML('beforeend', '<span class="date-dot"></span>');
            } else if (dot) {
                dot.remove();
            }
        }

        function fmtNum(v) {
            const rounded = Math.round(v * 10) / 10;
            return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
        }

        function recalcRM() {
            document.querySelectorAll('#set-rows .set-row').forEach(function (row) {
                const kgEl = row.querySelector('input[name="kg"]');
                const repsEl = row.querySelector('input[name="reps"]');
                const rirEl = row.querySelector('input[name="rir"]');
                const cell = row.querySelector('.rm-cell');
                if (!cell || !kgEl || !repsEl) return;
                const kg = parseFloat(kgEl.value);
                const reps = parseFloat(repsEl.value);
                const rirRaw = rirEl ? rirEl.value : '';
                const rir = rirRaw ? parseFloat(rirRaw) : 0;
                if (!isNaN(kg) && !isNaN(reps)) {
                    cell.textContent = fmtNum(kg * (1 + 0.0333 * (reps + 1 + rir)));
                } else {
                    cell.textContent = '—';
                }
            });
        }

        /* ---------- Eventos ---------- */
        document.getElementById('confirm-cancel').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onDiscard) cbs.onDiscard();
        });
        document.getElementById('confirm-save').addEventListener('click', function () {
            const cbs = confirmCbs;
            hideConfirmDialog();
            if (cbs && cbs.onSave) cbs.onSave();
        });

        document.addEventListener('DOMContentLoaded', function () {
            scheduleNotices();
            syncEditorFromContent();
            initRowSortable();
            initPanelDropZone();
            initTemplateSortable();
            fitRowsToPanel();
        });

        document.body.addEventListener('htmx:afterSwap', function (e) {
            scheduleNotices();
            handleEditorState();
            if (e.detail && e.detail.target) {
                if (e.detail.target.id === 'session-editor-wrap') {
                    syncEditorFromContent();
                    if (document.getElementById('plantilla-applied')) {
                        document.getElementById('plantilla-applied').remove();
                        plantillaAppliedPending = true;
                    }
                    initRowSortable();
                    fitRowsToPanel();
                } else if (e.detail.target.id === 'plantillas-section') {
                    initTemplateSortable();
                }
            }
        });

        document.body.addEventListener('htmx:afterSettle', function (e) {
            if (!plantillaAppliedPending) return;
            const target = e.detail && e.detail.target;
            if (target && (target.id === 'session-editor-wrap' || target === document.body)) {
                plantillaAppliedPending = false;
                const editor = document.getElementById('session-editor');
                if (editor) {
                    editor.dataset.baseline = '';
                    updateEditActions();
                }
            }
        });

        document.body.addEventListener('htmx:afterRequest', function (e) {
            scheduleNotices();
            handleEditorState();
            initTemplateSortable();
            const ptForm = e.detail && e.detail.elt && e.detail.elt.closest
                ? e.detail.elt.closest('#save-template-form')
                : null;
            if (ptForm && e.detail.successful) {
                guardarPlantillaToggle(false);
            }
            if (saveRequested) {
                saveRequested = false;
                const undoRes = document.getElementById('undo-result');
                if (undoRes && undoRes.dataset.fecha) {
                    updateDateDot(undoRes.dataset.fecha, undoRes.dataset.hasData === '1');
                    undoRes.removeAttribute('data-fecha');
                    undoRes.removeAttribute('data-has-data');
                }
                const outcome = document.getElementById('save-outcome');
                if (e.detail.successful && outcome && outcome.dataset.ok === '1') {
                    setTimeout(function () {
                        const form = document.getElementById('session-form');
                        const fechaInput = form && form.querySelector('input[name="fecha"]');
                        const fecha = fechaInput ? fechaInput.value : '';
                        const st = document.getElementById('editor-state');
                        if (st && st.dataset.hasData !== undefined) {
                            updateDateDot(fecha, st.dataset.hasData === '1');
                            syncEditButtons();
                        }
                        recalcRM();
                        syncEditorFromContent();
                        fitRowsToPanel();
                    }, 100);
                    if (pendingNav) {
                        const target = pendingNav;
                        pendingNav = null;
                        setTimeout(function () { doNav(target, true); }, 150);
                    }
                } else {
                    pendingNav = null;
                }
            }
        });

        document.addEventListener('submit', function (e) {
            const form = e.target.closest('#session-form');
            if (!form) return;
            if (editorEditmode() !== '1') {
                e.preventDefault();
                return;
            }
            saveRequested = true;
        }, true);

        document.addEventListener('input', function (e) {
            if (e.target.closest('#session-form')) {
                updateEditActions();
                syncTemplateEjercicios();
            }
        });
        document.addEventListener('change', function (e) {
            if (e.target.closest('#session-form')) {
                updateEditActions();
                syncTemplateEjercicios();
            }
        });

        document.addEventListener('keydown', function (e) {
            const inField = e.target.closest && e.target.closest('input, textarea');
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (inField) return;
                e.preventDefault();
                undoAction();
                return;
            }
            if (e.key === 'Enter' && inField && e.target.closest('#save-template-form input[name="nombre"]')) {
                e.preventDefault();
                confirmEntrenoSave();
            }
        }, true);
    </script>
</body>
</html>
