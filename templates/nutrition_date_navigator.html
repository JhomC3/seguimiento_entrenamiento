<div class="flex items-center justify-between border-b border-neutral-800 pb-2">
    <h3 class="text-sm font-black tracking-[0.2em] text-burgundy-400 uppercase neon-title">{{ fecha_display }}</h3>
    <div class="flex items-center gap-1.5">
        <button
            type="button"
            data-action="nutrition-prev"
            aria-label="Día anterior"
            class="h-7 w-7 grid place-items-center rounded-lg bg-white/[0.04] hover:bg-white/[0.08] text-neutral-300 transition-colors"
        >‹</button>
        <input
            type="date"
            name="fecha"
            value="{{ fecha_iso }}"
            data-action="nutrition-date-input"
            class="h-7 bg-matte-950 border border-neutral-800 rounded-lg px-2 text-xs text-neutral-200 focus:border-burgundy-700 focus:outline-none [color-scheme:dark]"
        >
        <button
            type="button"
            data-action="nutrition-next"
            aria-label="Día siguiente"
            class="h-7 w-7 grid place-items-center rounded-lg bg-white/[0.04] hover:bg-white/[0.08] text-neutral-300 transition-colors"
        >›</button>
    </div>
</div>
