<div class="panel panel-default">
    <h3 class="panel-title panel-title-neon panel-title-divider">Entrenamientos</h3>
    {% if not plantillas %}
    <p class="text-xs text-neutral-400 text-center">Aún no hay entrenos.<br>Guarda uno desde el editor.</p>
    {% else %}
    <div id="plantillas-list" class="flex flex-col gap-2.5">
        {% for p in plantillas %}
        <div class="pt-card card" id="pt-card-{{ p.id }}" data-pt-id="{{ p.id }}" data-pt-nombre="{{ p.nombre }}">
            <span class="text-xs font-bold text-neutral-200 truncate">{{ p.nombre }}</span>
            <div class="flex gap-1">
                <button type="button" data-action="apply-template" data-template-id="{{ p.id }}" class="pt-btn pt-btn-burgundy flex-1">Aplicar</button>
                <button type="button" data-action="edit-template" data-template-id="{{ p.id }}" class="pt-btn flex-1">Editar</button>
                <button type="button" data-action="delete-template" data-template-id="{{ p.id }}" data-template-name="{{ p.nombre }}" class="pt-btn flex-1">Eliminar</button>
            </div>
            {% if editing_id == p.id %}
            <form hx-post="/plantilla/editar/{{ p.id }}" hx-swap="none" class="flex flex-col gap-1.5 mt-1.5 pt-1.5 border-t border-neutral-800">
                {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
                <input name="nombre" aria-label="Nombre del entreno" value="{{ p.nombre }}" class="w-full cell-input" placeholder="Nombre del entreno">
                <div id="plantilla-edit-rows" class="flex flex-col gap-1">
                    {% for ej in p.ejercicios %}
                    <div class="pt-row flex gap-1 items-center">
                        <select name="ejercicio" class="pt-select cell-select">
                            <option value="{{ ej }}" selected>{{ ej }}</option>
                            {% for c in catalog %}{% if c != ej %}<option value="{{ c }}">{{ c }}</option>{% endif %}{% endfor %}
                        </select>
                        
                        <button type="button" data-action="template-row-remove" class="row-btn" title="Quitar ejercicio" aria-label="Quitar ejercicio">−</button>
                    </div>
                    {% endfor %}
                </div>
                <button type="button" data-action="template-row-add" class="row-btn self-start" title="Agregar ejercicio" aria-label="Agregar ejercicio a la plantilla">+</button>
                <div class="flex gap-1 items-center">
                    <button type="button" data-action="refresh-templates" class="btn-x" aria-label="Cancelar" title="Cancelar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                    <button type="submit" class="btn-check" aria-label="Guardar" title="Guardar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                    </button>
                </div>
            </form>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
