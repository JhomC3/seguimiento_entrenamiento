<div class="panel panel-default animate-fade-in">
    <form id="exercise-create-form" hx-post="/ejercicio/nuevo" hx-swap="none" class="flex flex-col gap-2">
        <input
            name="ejercicio" required placeholder="Nombre del ejercicio" aria-label="Nombre del ejercicio"
            class="field-input"
        >
        <div class="combo-wrap">
            <input
                name="grupo_muscular" required placeholder="Grupo muscular" aria-label="Grupo muscular"
                class="field-input" autocomplete="off" role="combobox" aria-expanded="false"
                aria-controls="grupo-list" aria-autocomplete="list"
            >
            <ul id="grupo-list" class="combo-list" role="listbox" aria-label="Grupos musculares" hidden>
                {% for m in grupo_options %}<li role="option" id="grupo-opt-{{ loop.index }}" data-value="{{ m.nombre }}" data-categoria="{{ m.categoria }}">{{ m.nombre }}</li>{% endfor %}
            </ul>
        </div>
        <input type="hidden" name="categoria" value="">
        <button
            type="submit"
            class="btn btn-create w-full"
        >Crear ejercicio</button>
    </form>
</div>
