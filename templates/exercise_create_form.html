<div class="panel panel-default animate-fade-in">
    <h4 class="panel-title">Nuevo ejercicio</h4>

    <form id="exercise-create-form" hx-post="/ejercicio/nuevo" hx-swap="none" class="flex flex-col gap-2">
        <input
            name="ejercicio" required placeholder="Nombre del ejercicio" aria-label="Nombre del ejercicio"
            class="field-input"
        >
        <input
            name="grupo_muscular" required placeholder="Grupo muscular (ej: Pectoral)" list="muscle-list" aria-label="Grupo muscular"
            class="field-input"
        >
        <datalist id="muscle-list">
            {% for m in muscle_names %}<option value="{{ m }}">{% endfor %}
        </datalist>
        <select
            name="categoria" required aria-label="Categoría"
            class="field-input"
        >
            <option value="">— Categoría —</option>
            {% for c in categories %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
        </select>
        <button
            type="submit"
            class="btn btn-primary h-9"
        >Crear ejercicio</button>
    </form>
</div>
