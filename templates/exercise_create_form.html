<div id="exercise-create" class="hidden">
    <form id="exercise-create-form" hx-post="/ejercicio/nuevo" hx-swap="none" class="flex flex-col gap-2">
        <input
            name="ejercicio" required placeholder="Nombre del ejercicio"
            class="bg-matte-950 border border-neutral-800 rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none"
        >
        <input
            name="grupo_muscular" required placeholder="Grupo muscular (ej: Pectoral)" list="muscle-list"
            class="bg-matte-950 border border-neutral-800 rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none"
        >
        <datalist id="muscle-list">
            {% for m in muscle_names %}<option value="{{ m }}">{% endfor %}
        </datalist>
        <select
            name="categoria" required
            class="bg-matte-950 border border-neutral-800 rounded px-2 py-1.5 text-xs text-neutral-200 focus:border-burgundy-700 focus:outline-none"
        >
            <option value="">— Categoría —</option>
            {% for c in categories %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
        </select>
        <button
            type="submit"
            class="h-8 bg-burgundy-700 hover:bg-burgundy-600 text-white text-[11px] rounded-lg transition-all uppercase tracking-widest font-black"
        >Crear ejercicio</button>
    </form>
</div>
