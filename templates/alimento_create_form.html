<div id="alimento-create" class="hidden">
    <form id="alimento-create-form" hx-post="/alimento/nuevo" hx-swap="none" class="flex flex-col gap-2">
        <div class="grid grid-cols-2 gap-1.5">
            <input
                name="nombre" required placeholder="Nombre del alimento"
                class="bg-matte-950 border border-neutral-800 rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none col-span-2"
            >
            <input
                name="categoria" placeholder="Categoría (ej: Fruta)"
                class="bg-matte-950 border border-neutral-800 rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none col-span-2"
            >
            {% for field in nutrient_fields if field.name in ('kcal', 'carbohidratos', 'proteina', 'grasa') %}
            <label class="flex flex-col gap-0.5 text-[9px] text-neutral-500 uppercase tracking-wider">
                {{ field.label }}
                <input
                    name="{{ field.name }}" type="number" step="0.1" min="0" value="0"
                    class="bg-matte-950 border border-neutral-800 rounded px-1.5 py-1 text-[11px] text-neutral-200 focus:border-burgundy-700 focus:outline-none"
                >
            </label>
            {% endfor %}
        </div>
        <details class="text-[10px] text-neutral-500">
            <summary class="cursor-pointer hover:text-neutral-300 uppercase tracking-widest font-bold">Otros nutrientes</summary>
            <div class="grid grid-cols-5 gap-1.5 mt-2">
                {% for field in nutrient_fields if field.name in ('fibra', 'hierro', 'calcio', 'vitamina_c', 'vitamina_a') %}
                <label class="flex flex-col gap-0.5 text-[9px] text-neutral-500 uppercase tracking-wider">
                    {{ field.label }}
                    <input
                        name="{{ field.name }}" type="number" step="0.1" min="0" value="0"
                        class="bg-matte-950 border border-neutral-800 rounded px-1.5 py-1 text-[11px] text-neutral-200 focus:border-burgundy-700 focus:outline-none"
                    >
                </label>
                {% endfor %}
            </div>
        </details>
        <button
            type="submit"
            class="h-8 bg-burgundy-700 hover:bg-burgundy-600 text-white text-[11px] rounded-lg transition-all uppercase tracking-widest font-black"
        >Crear alimento</button>
    </form>
</div>
