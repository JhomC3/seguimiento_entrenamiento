<div id="editor-state" data-readonly="{{ 1 if readonly else 0 }}" data-has-data="{{ 1 if has_data else 0 }}" hidden></div>
    <div class="flex items-center justify-between">
        <div class="flex items-baseline gap-2">
            <h3 class="text-sm font-black tracking-[0.2em] text-burgundy-400 uppercase neon-title">{{ dia }} {{ fecha_db }}</h3>
            <span class="text-[11px] text-neutral-500">Semana {{ semana }}</span>
        </div>
        <div class="flex items-center gap-2">
            <button
                type="button"
                onclick="guardarPlantillaToggle()"
                class="edit-toggle save-template-btn"
                aria-label="Guardar como plantilla"
                title="Guardar como plantilla"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <button
                type="button"
                onclick="toggleEdit()"
                class="edit-toggle pencil-btn {% if readonly %}off{% else %}on{% endif %}"
                aria-label="Editar sesión"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.13 2.86a3 3 0 0 0-4.17 0l-13 13L2 22l6.19-2L21.13 7a3 3 0 0 0 0-4.16zM6.77 18.57l-1.35-1.34L16.64 6 18 7.35z"></path></svg>
            </button>
        </div>
    </div>

    <div id="save-template-form-wrap" class="hidden">
        <form id="save-template-form" hx-post="/plantilla/guardar" hx-swap="none" class="flex items-center gap-2">
            <input
                name="nombre"
                placeholder="Nombre de la plantilla"
                class="flex-1 min-w-0 bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 focus:outline-none transition-colors"
            >
            <button
                type="submit"
                class="h-8 px-4 bg-black/70 hover:bg-neutral-900/70 backdrop-blur-sm text-white border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Guardar</button>
            <button
                type="button"
                onclick="guardarPlantillaToggle(false)"
                class="h-8 px-3 bg-black/70 hover:bg-neutral-900/70 backdrop-blur-sm text-neutral-300 border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Cancelar</button>
        </form>
    </div>

    <form id="session-form" hx-post="/entrenamiento/session/save" hx-swap="none" class="flex flex-col gap-1.5">
        <input type="hidden" name="fecha" value="{{ fecha_iso }}">
        <div class="table-scroll overflow-x-auto overflow-y-auto">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr>
                        <th class="w-8 py-0 px-1.5 font-bold text-neutral-500 uppercase tracking-wider text-center">#</th>
                        <th class="py-0 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Ejercicio</th>
                        <th class="w-20 py-0 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Peso</th>
                        <th class="w-20 py-0 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Reps</th>
                        <th class="w-20 py-0 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">RIR</th>
                        <th class="w-24 py-0 px-1.5 font-bold text-burgundy-400 uppercase tracking-wider text-center">RMₐ</th>
                        <th class="w-12 py-0 px-1.5"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-neutral-800/40" id="set-rows">
                    {% for r in rows %}
                    <tr class="set-row group transition-colors duration-150">
                        <td class="set-num py-0.5 px-1.5 text-neutral-600 font-bold text-center">{{ loop.index }}</td>
                        <td class="py-0.5 px-1.5">
                            <select
                                name="ejercicio"
                                class="ej-select w-full appearance-none bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1 text-xs text-neutral-200 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                                <option value="">— Ejercicio —</option>
                                {% if r.ejercicio %}<option value="{{ r.ejercicio }}" selected>{{ r.ejercicio }}</option>{% endif %}
                                {% for ej in catalog %}{% if ej != r.ejercicio %}<option value="{{ ej }}">{{ ej }}</option>{% endif %}{% endfor %}
                            </select>
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="kg" type="number" step="0.1" min="0" placeholder="kg"
                                value="{{ "%g"|format(r.kg) if r.kg is not none and r.kg != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="reps" type="number" step="1" min="0" placeholder="reps"
                                value="{{ "%g"|format(r.reps) if r.reps is not none and r.reps != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="rir" type="number" step="0.1" min="0" placeholder="RIR"
                                value="{{ "%g"|format(r.rir) if r.rir is not none and r.rir != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="rm-cell py-0.5 px-1.5 text-center font-bold text-burgundy-300 whitespace-nowrap">{{ "%g"|format(r.rm) if r.rm is not none else "—" }}</td>
                        <td class="py-0.5 px-1.5">
                            <div class="row-actions flex gap-1 justify-end opacity-0 group-hover:opacity-100 transition-opacity duration-150 {% if readonly %}hidden{% endif %}">
                                <button type="button" onclick="removeRow(this)" class="row-btn" title="Eliminar fila">−</button>
                                <button type="button" onclick="addRowAfter(this)" class="row-btn" title="Agregar fila">+</button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div id="edit-actions" class="mt-2 h-8 flex items-center gap-2 invisible">
            <button
                type="submit"
                class="h-8 px-5 bg-black/70 hover:bg-neutral-900/70 backdrop-blur-sm text-white border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Guardar</button>
            <button
                type="button"
                hx-get="/fecha/editor?fecha={{ fecha_iso }}"
                hx-target="#session-editor-wrap"
                hx-swap="innerHTML"
                class="h-8 px-4 bg-black/70 hover:bg-neutral-900/70 backdrop-blur-sm text-neutral-300 border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Cancelar</button>
        </div>
    </form>
