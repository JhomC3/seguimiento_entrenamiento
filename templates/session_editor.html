<div id="editor-state" data-readonly="{{ 1 if readonly else 0 }}" data-has-data="{{ 1 if has_data else 0 }}" hidden></div>
    <div class="panel-content">
    <div class="flex items-center justify-between gap-2 px-1 pt-1">
        <div class="panel-title-box">
            <h3 class="text-sm font-black tracking-[0.2em] text-burgundy-400 uppercase neon-title truncate">Entrenamiento</h3>
        </div>
        <div class="flex items-center gap-2 flex-none">
            <button
                type="button"
                data-action="toggle-panel-collapse"
                data-target="session-editor"
                aria-expanded="1"
                class="edit-toggle collapse-chevron"
                aria-label="Colapsar panel"
                title="Colapsar panel"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>
    </div>
    <div class="editor-header-actions flex-none flex items-center justify-end gap-1 px-1">
            <button
                type="button"
                data-action="toggle-template-form"
                class="edit-toggle save-template-btn"
                aria-label="Guardar como entreno"
                title="Guardar como entreno"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
            <div id="save-template-form-wrap" class="hidden">
                <form id="save-template-form" hx-post="/plantilla/guardar" hx-swap="none" class="flex items-center gap-1.5">
                    <input
                        name="nombre"
                        aria-label="Nombre del entreno"
                        placeholder="Nombre del entreno"
                        title="Enter para guardar"
                        class="w-36 sm:w-44 bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-400 focus:outline-none transition-colors"
                    >
                    <button type="button" data-action="cancel-template-form" class="btn-x" aria-label="Cancelar" title="Cancelar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                    <button type="button" data-action="confirm-template-save" class="btn-check" aria-label="Guardar entreno" title="Guardar entreno">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                    </button>
                </form>
            </div>
            <button
                type="button"
                data-action="toggle-edit"
                class="edit-toggle pencil-btn {% if readonly %}off{% else %}on{% endif %}"
                aria-label="Editar sesión"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.13 2.86a3 3 0 0 0-4.17 0l-13 13L2 22l6.19-2L21.13 7a3 3 0 0 0 0-4.16zM6.77 18.57l-1.35-1.34L16.64 6 18 7.35z"></path></svg>
            </button>
            <button
                type="button"
                data-action="delete-session"
                class="edit-toggle delete-session-btn"
                {% if not has_data %}hidden{% endif %}
                aria-label="Eliminar entreno"
                title="Eliminar entreno"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"></path></svg>
            </button>
        </div>

    <form id="session-form" hx-post="/entrenamiento/session/save" hx-swap="none" class="flex flex-col gap-1 mt-1.5">
        <input type="hidden" name="fecha" value="{{ fecha_iso }}">
        <div class="table-scroll overflow-x-auto overflow-y-auto">
            <table class="w-full text-left border-collapse text-xs">
                <caption class="sr-only">Series de entrenamiento del día</caption>
                <colgroup>
                    <col span="7">
                    <col class="set-actions-column">
                </colgroup>
                <thead>
                    <tr>
                        <th scope="col" class="w-8 py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider text-center">#</th>
                        <th scope="col" class="py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider">Ejercicio</th>
                        <th scope="col" class="w-20 py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider">Peso</th>
                        <th scope="col" class="w-20 py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider">Reps</th>
                        <th scope="col" class="w-20 py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider">RIR</th>
                        <th scope="col" class="w-16 py-0.5 px-1.5 font-bold text-neutral-400 uppercase tracking-wider">Desc</th>
                        <th scope="col" class="w-20 py-0.5 px-1.5 font-bold text-burgundy-400 uppercase tracking-wider text-center">RMₐ</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-neutral-800/40" id="set-rows">
                    {% for r in rows %}
                    <tr class="set-row group transition-colors duration-150">
                        <td class="set-num py-0.5 px-1.5 text-neutral-400 font-bold text-center">{{ loop.index }}</td>
                        <td class="py-0.5 px-1.5">
                            <select
                                name="ejercicio"
                                aria-label="Ejercicio, serie {{ loop.index }}"
                                class="ej-select w-full appearance-none bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-0.5 text-xs text-neutral-200 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                                <option value="">— Ejercicio —</option>
                                {% if r.ejercicio %}<option value="{{ r.ejercicio }}" selected>{{ r.ejercicio }}</option>{% endif %}
                                {% for ej in catalog %}{% if ej != r.ejercicio %}<option value="{{ ej }}">{{ ej }}</option>{% endif %}{% endfor %}
                            </select>
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="kg" type="number" step="0.1" min="0" placeholder="kg"
                                aria-label="Peso, serie {{ loop.index }}"
                                value="{{ "%g"|format(r.kg) if r.kg is not none and r.kg != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-0.5 text-xs text-neutral-200 placeholder-neutral-400 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="reps" type="number" step="1" min="0" placeholder="reps"
                                aria-label="Reps, serie {{ loop.index }}"
                                value="{{ "%g"|format(r.reps) if r.reps is not none and r.reps != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-0.5 text-xs text-neutral-200 placeholder-neutral-400 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <div class="relative">
                                 <input
                                     name="rir" type="number" step="any" min="-5" placeholder="RIR"
                                     aria-label="RIR, serie {{ loop.index }}"
                                     aria-describedby="rir-help-{{ loop.index }}"
                                     value="{{ "%g"|format(r.rir) if r.rir is not none and r.rir != "" else "" }}"
                                    class="w-full pr-4 bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-0.5 text-xs text-neutral-200 placeholder-neutral-400 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                    title="0 = fallo · negativo = forzadas"
                                    {% if readonly %}disabled{% endif %}
                                >
                                <span id="rir-help-{{ loop.index }}" class="sr-only">0 = fallo · negativo = forzadas</span>
                                <div class="absolute inset-y-0.5 right-0.5 flex flex-col w-3">
                                    <button
                                        type="button" data-action="rir-step" data-delta="0.1"
                                        class="rir-step flex-1" title="RIR +0,1" aria-label="Aumentar RIR"
                                        {% if readonly %}disabled{% endif %}
                                    >▲</button>
                                    <button
                                        type="button" data-action="rir-step" data-delta="-0.1"
                                        class="rir-step flex-1" title="RIR −0,1" aria-label="Disminuir RIR"
                                        {% if readonly %}disabled{% endif %}
                                    >▼</button>
                                </div>
                                <span class="rir-badge hidden absolute -top-1 -left-1 text-xs font-black px-1 rounded bg-burgundy-700 text-white"></span>
                            </div>
                        </td>
                        <td class="py-0.5 px-1.5">
                             <input
                                 name="descanso" type="number" step="5" min="0" placeholder="s"
                                 aria-label="Descanso, serie {{ loop.index }}"
                                 aria-describedby="descanso-help-{{ loop.index }}"
                                 value="{{ "%g"|format(r.descanso_seg) if r.descanso_seg is not none and r.descanso_seg != "" else "" }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-0.5 text-xs text-neutral-200 placeholder-neutral-400 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                title="Descanso entre series (segundos, opcional)"
                                {% if readonly %}disabled{% endif %}
                            >
                            <span id="descanso-help-{{ loop.index }}" class="sr-only">Descanso entre series (segundos, opcional)</span>
                        </td>
                        <td class="rm-cell py-0.5 px-1.5 text-center font-bold text-burgundy-300 whitespace-nowrap">{{ "%g"|format(r.rm) if r.rm is not none else "—" }}</td>
                        <td class="set-actions-column py-0.5">
                            <div class="row-actions flex w-full items-center justify-center gap-px opacity-0 group-hover:opacity-100 transition-opacity duration-150 {% if readonly %}hidden{% endif %}">
                                <button type="button" data-action="row-remove" class="row-btn" title="Eliminar fila">−</button>
                                <button type="button" data-action="row-add" class="row-btn" title="Agregar fila">+</button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div id="edit-actions" class="mt-1 h-7 flex items-center gap-2 invisible">
            <button
                type="button"
                hx-get="/fecha/editor?fecha={{ fecha_iso }}"
                hx-target="#session-editor-wrap"
                hx-swap="innerHTML"
                class="h-7 px-4 bg-black/50 hover:bg-neutral-900/70 backdrop-blur-sm text-neutral-300 border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Cancelar</button>
            <button
                type="submit"
                class="h-7 px-5 bg-black/50 hover:bg-neutral-900/70 backdrop-blur-sm text-white border border-neutral-800 text-xs rounded-lg transition-colors uppercase tracking-widest font-black"
            >Guardar</button>
        </div>
    </form>

    </div>
