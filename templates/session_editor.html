<div id="session-editor" class="relative bg-neutral-900 border border-transparent rounded-xl p-4 flex flex-col gap-3 neon-border metallic-border">
    <div class="flex items-center justify-between">
        <div class="flex items-baseline gap-2">
            <h3 class="text-sm font-black tracking-[0.2em] text-burgundy-400 uppercase neon-title">{{ dia }} {{ fecha_db }}</h3>
            <span class="text-[11px] text-neutral-500">Semana {{ semana }}</span>
        </div>
        <div class="flex items-center gap-2">
            <button
                type="button"
                onclick="enableEdit()"
                class="edit-toggle {% if readonly %}off{% else %}on{% endif %}"
                aria-label="Editar sesión"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.13 2.86a3 3 0 0 0-4.17 0l-13 13L2 22l6.19-2L21.13 7a3 3 0 0 0 0-4.16zM6.77 18.57l-1.35-1.34L16.64 6 18 7.35z"></path></svg>
            </button>
        </div>
    </div>

    {% if success %}
    <div class="notice notice-success" data-dismiss="3000">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="notice notice-error" data-dismiss="4500">{{ error }}</div>
    {% endif %}

    <form id="session-form" hx-post="/entrenamiento/session/save" hx-swap="none" class="flex flex-col gap-3">
        <input type="hidden" name="fecha" value="{{ fecha_iso }}">
        <div class="overflow-x-auto min-h-[640px]">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr>
                        <th class="w-8 py-0.5 px-1.5 font-bold text-neutral-500 uppercase tracking-wider text-center">#</th>
                        <th class="py-0.5 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Ejercicio</th>
                        <th class="w-20 py-0.5 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Peso</th>
                        <th class="w-20 py-0.5 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">Reps</th>
                        <th class="w-20 py-0.5 px-1.5 font-bold text-neutral-500 uppercase tracking-wider">RIR</th>
                        <th class="w-24 py-0.5 px-1.5 font-bold text-burgundy-400 uppercase tracking-wider text-center">RMₐ</th>
                        <th class="w-12 py-0.5 px-1.5"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-neutral-800/40" id="set-rows">
                    {% for r in rows %}
                    <tr class="set-row group {% if not readonly %}hover:bg-white/[0.04]{% endif %}">
                        <td class="set-num py-0.5 px-1.5 text-neutral-600 font-bold text-center">{{ loop.index }}</td>
                        <td class="py-0.5 px-1.5">
                            <select
                                name="ejercicio"
                                class="ej-select w-full appearance-none bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                                <option value="">— Ejercicio —</option>
                                {% if r.ejercicio %}<option value="{{ r.ejercicio }}" selected>{{ r.ejercicio }}</option>{% endif %}
                                {% for ej in catalog %}{% if ej != r.ejercicio %}<option value="{{ ej }}">{{ ej }}</option>{% endif %}{% endfor %}
                            </select>
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="kg" type="number" step="0.1" min="0" placeholder="kg"
                                value="{{ r.kg }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="reps" type="number" step="1" min="0" placeholder="reps"
                                value="{{ r.reps }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5">
                            <input
                                name="rir" type="number" step="0.1" min="0" placeholder="RIR"
                                value="{{ r.rir }}"
                                class="w-full bg-white/[0.04] hover:bg-white/[0.08] focus:bg-white/[0.1] rounded px-2 py-1.5 text-xs text-neutral-200 placeholder-neutral-600 disabled:text-neutral-300 disabled:bg-white/[0.02] focus:outline-none transition-colors"
                                {% if readonly %}disabled{% endif %}
                            >
                        </td>
                        <td class="py-0.5 px-1.5 text-center font-bold text-burgundy-300 whitespace-nowrap">{{ "%.1f"|format(r.rm) if r.rm is not none else "—" }}</td>
                        <td class="py-0.5 px-1.5">
                            <div class="row-actions flex gap-1 justify-end opacity-0 group-hover:opacity-100 transition-opacity" {% if readonly %}hidden{% endif %}>
                                <button type="button" onclick="removeRow(this)" class="row-btn" title="Eliminar fila">−</button>
                                <button type="button" onclick="addRowAfter(this)" class="row-btn" title="Agregar fila">+</button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div id="edit-actions" class="h-8 flex items-center gap-2 {% if readonly %}invisible{% endif %}">
            <button
                type="submit"
                class="h-8 px-5 bg-black hover:bg-neutral-900 text-white border border-neutral-800 text-xs rounded-lg transition-all uppercase tracking-widest font-black"
            >Guardar</button>
            {% if readonly %}
            <button
                type="button"
                hx-get="/fecha/editor?fecha={{ fecha_iso }}"
                hx-target="#session-editor"
                hx-swap="outerHTML"
                class="h-8 px-4 bg-black hover:bg-neutral-900 text-neutral-300 border border-neutral-800 text-xs rounded-lg transition-all uppercase tracking-widest font-black"
            >Cancelar</button>
            {% endif %}
        </div>
    </form>
</div>

<script>
    function enableEdit() {
        const form = document.getElementById('session-form');
        form.querySelectorAll('input, select').forEach(el => { el.disabled = false; });
        form.querySelectorAll('.row-actions').forEach(el => { el.hidden = false; });
        const pencil = document.querySelector('#session-editor .edit-toggle');
        if (pencil) {
            pencil.classList.remove('off');
            pencil.classList.add('on');
        }
        document.getElementById('edit-actions').classList.remove('invisible');
    }

    function addRowAfter(btn) {
        const row = btn.closest('.set-row');
        const clone = row.cloneNode(true);
        clone.querySelector('.ej-select').value = '';
        clone.querySelectorAll('input').forEach(input => { input.value = ''; });
        row.after(clone);
        renumberRows();
    }

    function removeRow(btn) {
        btn.closest('.set-row').remove();
        renumberRows();
    }

    function renumberRows() {
        document.querySelectorAll('#set-rows .set-row').forEach((row, i) => {
            row.querySelector('.set-num').textContent = i + 1;
        });
    }
</script>
