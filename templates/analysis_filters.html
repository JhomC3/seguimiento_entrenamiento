<div id="analysis-filters" class="flex items-center gap-2 flex-wrap">
    {% if nivel in ("grupo", "musculo") %}
        {% for item in items %}
        <button
            class="filter-chip"
            data-action="set-focus"
            data-focus="{{ item }}"
            aria-pressed="{{ 'true' if item == focus else 'false' }}"
        >{{ item }}</button>
        {% endfor %}
    {% elif nivel == "ejercicio" %}
        <input
            class="exercise-search bg-matte-950 border border-neutral-800 focus:border-burgundy-700 rounded-full px-3 py-1.5 text-xs text-neutral-200 w-56"
            list="analysis-exercises"
            placeholder="Buscar ejercicio y Enter…"
            autocomplete="off"
        >
        <datalist id="analysis-exercises">
            {% for e in ejercicios %}<option value="{{ e }}">{% endfor %}
        </datalist>
    {% endif %}
</div>
