{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8 flex flex-col gap-8">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-neutral-800 pb-4">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-[0.2em] text-white uppercase">Gym Tracker</h1>
            <a
                href="/exportar/csv"
                class="text-xs font-bold text-neutral-400 hover:text-burgundy-400 border border-neutral-800 hover:border-burgundy-700 rounded px-2 py-1 transition-all uppercase tracking-widest"
            >Exportar CSV</a>
        </div>
        <div class="flex items-center gap-3">
            <button
                type="button"
                data-action="undo-last"
                class="text-xs font-bold text-neutral-400 hover:text-burgundy-400 border border-neutral-800 hover:border-burgundy-700 rounded px-2 py-1 transition-all uppercase tracking-widest"
                title="Deshacer la última acción (Ctrl+Z)"
            >↶ Deshacer (Ctrl+Z)</button>
            <button
                data-action="open-editor-popup"
                class="bg-burgundy-700 hover:bg-burgundy-600 text-white text-xs font-black tracking-widest uppercase rounded-full px-5 h-11 transition-colors"
            >+ Registrar</button>
        </div>
    </header>

    <!-- Músculos (fila persistente) + ejercicios del músculo seleccionado -->
    <div class="flex flex-col gap-2 border-b border-neutral-800 pb-4">
        <div id="cascade-row">
            {{ cascade_row_html | safe }}
            <span class="htmx-indicator text-xs text-neutral-400">Cargando niveles…</span>
        </div>
        <div id="ejercicios-row">
            <span class="htmx-indicator text-xs text-neutral-400">Cargando ejercicios…</span>
        </div>
    </div>

    <!-- Contenido principal -->
    <main class="flex flex-col gap-6 min-w-0">
        <!-- Gráfica Única -->
        <div id="unified-chart-container" class="bg-neutral-900 border border-transparent rounded-xl p-5 neon-border metallic-border">
            <div id="unified-chart">
                {{ systemic_chart_html | safe }}
            </div>
        </div>

        <!-- Detalle y Tabla (loaded dynamically abajo de la gráfica) -->
        <section id="history-section" class="flex flex-col gap-4"></section>
    </main>
</div>

<noscript>
    <div class="notice notice-error" role="alert">
        El dashboard requiere JavaScript para editar, navegar y ver las gráficas.
        Sin JS puedes ver la vista inicial y <a href="/exportar/csv" class="underline">exportar los datos en CSV</a>.
    </div>
</noscript>

<!-- Ventana emergente de registro (alimentación + sesión + cardio) -->
<dialog id="editor-popup" class="editor-popup-dialog" aria-labelledby="popup-fecha-title">
    <div class="relative z-20 mx-auto my-6 max-w-4xl max-h-[calc(100vh-3rem)] overflow-y-auto bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-col">
        <div class="sticky top-0 z-30 bg-neutral-950 border-b border-neutral-800 px-5 py-3 flex items-center gap-4">
            <h2 class="text-sm font-black tracking-widest text-burgundy-400 uppercase neon-title" id="popup-fecha-title"></h2>
            <button id="popup-close" data-action="close-editor-popup" class="ml-auto text-neutral-400 hover:text-white text-xl leading-none px-2" aria-label="Cerrar">×</button>
        </div>
        <div id="popup-body" class="flex flex-col gap-4 p-5"></div>
    </div>
</dialog>
{% endblock %}
