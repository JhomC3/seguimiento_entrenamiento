{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8 flex flex-col gap-8">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-neutral-800 pb-4">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-[0.2em] text-white uppercase">Gym Tracker</h1>
            <a
                href="/exportar/csv"
                class="text-[10px] font-bold text-neutral-500 hover:text-burgundy-400 border border-neutral-800 hover:border-burgundy-700 rounded px-2 py-1 transition-all uppercase tracking-widest"
            >Exportar CSV</a>
        </div>
        <button
            data-action="open-editor-popup"
            class="bg-burgundy-700 hover:bg-burgundy-600 text-white text-[11px] font-black tracking-widest uppercase rounded-full px-4 py-2 transition-colors"
        >+ Registrar</button>
    </header>

    <!-- Músculos (fila persistente) + ejercicios del músculo seleccionado -->
    <div class="flex flex-col gap-2 border-b border-neutral-800 pb-4">
        <div id="cascade-row"></div>
        <div id="ejercicios-row"></div>
    </div>

    <!-- Contenido principal -->
    <main class="flex flex-col gap-6 min-w-0">
        <!-- Gráfica Única -->
        <div id="unified-chart-container" class="bg-neutral-900 border border-transparent rounded-xl p-5 neon-border metallic-border">
            <div id="unified-chart">
                {{ systemic_chart_html | safe }}
            </div>
        </div>

        <!-- Detalle y Tabla (loaded dynamically abajo de la gráfica) -->
        <section id="history-section" class="flex flex-col gap-4"></section>
    </main>
</div>

<!-- Ventana emergente de registro (alimentación + sesión + cardio) -->
<div id="editor-popup" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 glass-backdrop" data-action="close-editor-popup"></div>
    <div class="relative z-10 mx-auto my-6 max-w-4xl max-h-[calc(100vh-3rem)] overflow-y-auto bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-col">
        <div class="sticky top-0 z-20 bg-neutral-950 border-b border-neutral-800 px-5 py-3 flex items-center gap-4">
            <h2 class="text-sm font-black tracking-widest text-burgundy-400 uppercase neon-title" id="popup-fecha-title"></h2>
            <button id="popup-close" data-action="close-editor-popup" class="ml-auto text-neutral-500 hover:text-white text-xl leading-none px-2" aria-label="Cerrar">×</button>
        </div>
        <div id="popup-body" class="flex flex-col gap-4 p-5"></div>
    </div>
</div>


<style>
    .htmx-indicator {
        display: none;
    }
    .htmx-request .htmx-indicator {
        display: inline;
    }
    .htmx-request.htmx-indicator {
        display: inline;
    }

    #unified-chart .plotly-graph-div,
    #unified-chart .js-plotly-plot {
        animation: chartFadeIn 0.3s ease-out;
    }
    @keyframes chartFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Niveles de análisis y cascada (colores del tema anterior) */
    .level-btn {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: #a3a3a3;
        border: 1px solid #262626;
        border-radius: 9999px;
        padding: .3rem .8rem;
        transition: all 150ms ease-out;
        cursor: pointer;
    }
    .level-btn:hover {
        color: #e5e5e5;
        border-color: #404040;
    }
    .level-btn.active {
        color: #e56d88;
        border-color: #9b1b30;
        background: rgba(155, 27, 48, 0.15);
    }
    .level-chip {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #a3a3a3;
        border: 1px solid #262626;
        border-radius: 9999px;
        padding: .25rem .7rem;
        transition: all 150ms ease-out;
        cursor: pointer;
        background: transparent;
    }
    .level-chip:hover {
        color: #e5e5e5;
        border-color: #404040;
    }
    .level-chip.selected {
        color: #e56d88;
        border-color: #9b1b30;
        background: rgba(155, 27, 48, 0.15);
    }
    .exercise-chip[aria-pressed="true"] {
        color: #e56d88;
        border-color: #9b1b30;
        background: rgba(155, 27, 48, 0.15);
    }
    .detail-link {
        font-size: 11px;
        color: #737373;
        cursor: pointer;
        background: transparent;
        border: 0;
        padding: 0 2px;
        line-height: 1;
    }
    .detail-link:hover {
        color: #e56d88;
    }
</style>
{% endblock %}
