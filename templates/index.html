{% extends "base.html" %}
{% block content %}
<div class="dashboard-page">
    <header class="dashboard-header">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-[0.2em] text-white uppercase">Gym Tracker</h1>
            <a
                href="/splits"
                class="btn btn-outline"
            >Splits</a>
        </div>
        <div class="flex items-center gap-3">
            <button
                data-action="open-editor-popup"
                class="btn btn-primary rounded-full px-5 h-11"
            >+ Registrar</button>
        </div>
    </header>

    <div class="dashboard-layout">
        <!-- Panel izquierdo: catálogo de músculos y ejercicios (sticky en desktop) -->
        <aside class="dashboard-catalog-col">
            <section class="panel panel-default">
                {% include "partials/dashboard_catalog.html" %}
            </section>
        </aside>

        <!-- Panel derecho: gráfica, resumen y detalle -->
        <main class="dashboard-analytics-col">
                <div id="unified-chart-container" class="panel panel-spacious relative">
                <!-- Selector granularidad compacto junto al título, fuera de #unified-chart -->
                <div
                    id="granularity-selector"
                    class="absolute top-3 right-3 inline-flex items-center rounded-lg border border-neutral-800 overflow-hidden z-10"
                    role="group"
                    aria-label="Periodo de la gráfica"
                >
                    <button
                        type="button"
                        data-action="set-granularity"
                        data-gran="day"
                        class="px-3 py-1 text-xs font-medium bg-burgundy-600 text-white"
                        aria-pressed="true"
                        aria-label="Día"
                    >Día</button>
                    <button
                        type="button"
                        data-action="set-granularity"
                        data-gran="week"
                        class="px-3 py-1 text-xs font-medium text-neutral-400 hover:text-white"
                        aria-pressed="false"
                        aria-label="Semana"
                    >Semana</button>
                    <button
                        type="button"
                        data-action="set-granularity"
                        data-gran="month"
                        class="px-3 py-1 text-xs font-medium text-neutral-400 hover:text-white"
                        aria-pressed="false"
                        aria-label="Mes"
                    >Mes</button>
                </div>
                <div id="unified-chart">
                    {{ systemic_chart_html | safe }}
                </div>
            </div>

            <section id="history-section" class="flex flex-col gap-4">
                <div class="panel panel-default">
                    <p class="text-xs text-neutral-400 px-3 py-2">Selecciona un músculo y un ejercicio para ver su detalle.</p>
                </div>
            </section>
        </main>
    </div>
</div>

<noscript>
    <div class="notice notice-error" role="alert">
        El dashboard requiere JavaScript para editar, navegar y ver las gráficas.
    </div>
</noscript>

<!-- Ventana emergente de registro (alimentación + sesión + cardio) -->
<dialog id="editor-popup" class="editor-popup-dialog" aria-labelledby="popup-fecha-title">
    <div class="relative z-20 mx-auto my-6 max-w-4xl max-h-[calc(100vh-3rem)] overflow-y-auto bg-neutral-950 border border-neutral-800 rounded-2xl flex flex-col">
        <div class="sticky top-0 z-30 bg-neutral-950 border-b border-neutral-800 px-5 py-3 flex items-center gap-4">
            <h2 class="panel-title panel-title-neon" id="popup-fecha-title"></h2>
            <button id="popup-close" data-action="close-editor-popup" class="ml-auto text-neutral-400 hover:text-white text-xl leading-none px-2" aria-label="Cerrar">×</button>
        </div>
        <div id="popup-body" class="flex flex-col gap-4 p-5"></div>
    </div>
</dialog>
{% endblock %}
