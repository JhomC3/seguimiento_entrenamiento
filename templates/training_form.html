<div id="training-form" class="bg-neutral-900 border border-transparent rounded-xl p-5 flex flex-col gap-4 neon-border metallic-border animate-fade-in">
    <div class="flex items-center justify-between pb-3 border-b border-neutral-800">
        <h3 class="text-sm font-black tracking-[0.2em] text-burgundy-400 uppercase neon-title">
            {% if edit %}Editar Entrenamiento{% else %}Entrenamiento del día{% endif %}
        </h3>
        <span id="train-semana" class="text-xs font-black text-burgundy-400 uppercase tracking-widest">—</span>
    </div>

    {% if success %}
    <div class="rounded-lg bg-emerald-950/40 border border-emerald-800 text-emerald-300 text-xs px-3 py-2">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="rounded-lg bg-red-950/40 border border-red-800 text-red-300 text-xs px-3 py-2">{{ error }}</div>
    {% endif %}

    <form
        hx-post="{% if edit %}/entrenamiento/session/update{% else %}/entrenamiento{% endif %}"
        hx-target="#training-form"
        hx-swap="outerHTML"
        class="flex flex-col gap-4"
    >
        {% if edit %}
        <input type="hidden" name="old_semana" value="{{ edit.semana }}">
        <input type="hidden" name="old_dia" value="{{ edit.dia }}">
        <input type="hidden" name="old_fecha" value="{{ edit.fecha }}">
        {% endif %}

        <div class="flex flex-wrap items-end gap-3">
            <label class="flex flex-col gap-1 text-xs font-bold text-neutral-400 uppercase tracking-wider">
                Fecha
                <input
                    type="date"
                    name="fecha"
                    id="train-fecha"
                    value="{{ form_fecha }}"
                    onchange="updateSemana()"
                    class="bg-matte-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 focus:border-burgundy-700 focus:outline-none"
                >
            </label>
            <button
                type="button"
                onclick="addSetRow(true)"
                class="h-10 px-3 bg-matte-950 hover:bg-burgundy-700 hover:text-white text-neutral-400 border border-neutral-700 hover:border-burgundy-700 text-xs rounded-lg transition-all uppercase tracking-widest font-black"
            >+ Serie</button>
            <button
                type="button"
                hx-get="/ejercicio/nuevo/form"
                hx-target="#exercise-create-container"
                hx-swap="innerHTML"
                class="h-10 px-3 bg-matte-950 hover:bg-burgundy-700 hover:text-white text-neutral-400 border border-neutral-700 hover:border-burgundy-700 text-xs rounded-lg transition-all uppercase tracking-widest font-black"
            >Nuevo ejercicio</button>
        </div>

        <div id="set-rows" class="flex flex-col gap-2">
            {% for s in form_sets %}
            <div class="set-row grid grid-cols-12 gap-2 items-center">
                <select
                    name="ejercicio"
                    class="ej-select col-span-5 bg-matte-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 focus:border-burgundy-700 focus:outline-none"
                >
                    <option value="">— Ejercicio —</option>
                    {% for ej in catalog %}
                    <option value="{{ ej }}" {% if s.ejercicio == ej %}selected{% endif %}>{{ ej }}</option>
                    {% endfor %}
                </select>
                <input
                    name="kg" type="number" step="0.5" min="0" placeholder="kg"
                    value="{{ s.kg }}"
                    class="col-span-2 bg-matte-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none"
                >
                <input
                    name="reps" type="number" step="0.5" min="0" placeholder="reps"
                    value="{{ s.reps }}"
                    class="col-span-2 bg-matte-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none"
                >
                <input
                    name="rir" type="number" step="0.5" min="0" placeholder="RIR"
                    value="{{ s.rir }}"
                    class="col-span-2 bg-matte-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-200 placeholder-neutral-600 focus:border-burgundy-700 focus:outline-none"
                >
                <button
                    type="button"
                    onclick="this.closest('.set-row').remove()"
                    class="col-span-1 h-10 text-neutral-500 hover:text-burgundy-400 text-sm font-black"
                >✕</button>
            </div>
            {% endfor %}
        </div>

        <div class="flex gap-2">
            <button
                type="submit"
                class="h-10 px-6 bg-burgundy-700 hover:bg-burgundy-600 text-white text-xs rounded-lg transition-all uppercase tracking-widest font-black"
            >{% if edit %}Guardar cambios{% else %}Guardar{% endif %}</button>
            {% if edit %}
            <a
                hx-get="/entrenamiento/form"
                hx-target="#training-form"
                hx-swap="outerHTML"
                class="h-10 px-6 inline-flex items-center bg-matte-950 hover:bg-neutral-800 text-neutral-400 border border-neutral-700 text-xs rounded-lg transition-all uppercase tracking-widest font-black cursor-pointer"
            >Cancelar</a>
            {% endif %}
        </div>
    </form>
</div>

<script>
    const CICLO_START = new Date('{{ ciclo_start_iso }}T00:00:00');

    function updateSemana() {
        const input = document.getElementById('train-fecha');
        const label = document.getElementById('train-semana');
        if (!input || !label || !input.value) return;
        const fecha = new Date(input.value + 'T00:00:00');
        const diff = Math.floor((fecha - CICLO_START) / 86400000);
        label.textContent = 'Semana ' + Math.max(1, Math.floor(diff / 7) + 1);
    }

    function addSetRow(copyExercise) {
        const rows = document.querySelectorAll('#set-rows .set-row');
        if (!rows.length) return;
        const last = rows[rows.length - 1];
        const clone = last.cloneNode(true);
        let exercise = '';
        if (copyExercise) exercise = last.querySelector('.ej-select').value;
        clone.querySelector('.ej-select').value = exercise;
        clone.querySelectorAll('input').forEach(input => { input.value = ''; });
        last.parentElement.appendChild(clone);
    }

    document.addEventListener('DOMContentLoaded', updateSemana);
</script>
