<!-- editor_popup.html — cuerpo de la ventana emergente de registro:
     navegador + título de fecha + alimentación + sesión + cardio del día.
     Replica los contenedores del contrato JS (#nutrition-panel, #session-editor,
     #editor-notice, #save-outcome) como en la home anterior. -->
<section id="date-navigator">{{ navigator_html | safe }}</section>

<section id="session-date-title" class="flex items-baseline gap-1.5">
    <h3 class="text-xs font-black tracking-widest text-burgundy-400 uppercase neon-title truncate">{{ dia }} {{ fecha_display }}</h3>
    <span class="text-xs text-neutral-400 flex-none">Semana {{ semana }}</span>
</section>

<div id="nutrition-templates-section">{{ nutrition_templates_html | safe }}</div>

<section id="nutrition-panel" data-editmode="0" class="bg-neutral-900 border border-transparent rounded-xl px-2 pt-2 pb-2 flex flex-col gap-2 neon-border metallic-border relative">
    <div id="nutrition-editor-wrap">
        {{ nutrition_editor_html | safe }}
    </div>
</section>

<div id="session-editor" data-editmode="0" class="bg-neutral-900 border border-transparent rounded-xl px-2 pt-2 pb-2 flex flex-col gap-2 neon-border metallic-border relative">
    <div id="editor-notice" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="save-outcome" data-ok="0" hidden></div>
    <section id="session-editor-wrap">
        {{ editor_html | safe }}
    </section>
</div>

<section id="cardio-day">
    {{ cardio_html | safe }}
</section>

<!-- Alta contextual + plantillas de entrenamiento -->
<div id="exercise-create">
    {{ exercise_form_html | safe }}
</div>

<div id="alimento-create">
    {{ alimento_form_html | safe }}
</div>

<div id="plantillas-section">
    {{ plantillas_html | safe }}
</div>
