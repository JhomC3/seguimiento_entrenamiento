[project]
name = "gym-tracker-dashboard"
version = "0.1.0"
description = "Gym progression dashboard with FastAPI, htmx and SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "python-multipart>=0.0.7",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pandas-stubs>=2.2.0",
    "playwright>=1.40.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["app.py", "src", "tests"]

# plotly ships no type stubs; silence only those imports, never user code.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
